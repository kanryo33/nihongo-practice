<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>五十音ランダム練習</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Meiryo","メイリオ","Noto Sans JP",system-ui,sans-serif}
body{min-height:100vh;background:#f8faf9;text-align:center;padding:40px 24px;color:#1f2937}
.wrap{max-width:1100px;margin:0 auto;background:#fff;padding:40px 32px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.08);border:1px solid #e5e7eb}
.ctrl{margin-bottom:28px;display:flex;gap:18px;flex-wrap:wrap;align-items:center;justify-content:center;font-size:16px;color:#4b5563}
.ctrl label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.ctrl-group{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:8px 14px;background:rgba(255,255,255,.7);border:1px solid #e5e7eb;border-radius:12px}
.ctrl-label{font-weight:700;color:#0f7a40;font-size:14px;margin-right:2px}
.ctrl input[type=radio]{width:16px;height:16px;accent-color:#0f7a40}
.ctrl input[type=checkbox]{width:16px;height:16px;accent-color:#0f7a40}
.kana-area{min-height:260px;display:flex;gap:26px;justify-content:center;align-items:center;flex-wrap:wrap;margin:30px 10px}

/* 卡片翻转核心样式 */
.flip-card{width:180px;height:220px;perspective:1000px;cursor:pointer;transition:transform .2s}
.flip-card:hover{transform:translateY(-3px)}
.flip-card-inner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip-card.flipped .flip-card-inner{transform:rotateY(180deg)}
.flip-card-front,.flip-card-back{position:absolute;width:100%;height:100%;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;box-shadow:0 8px 20px rgba(0,0,0,.08)}
.flip-card-front{background:#fff8e8;border:1px solid #f0e6c8}
.flip-card-back{background:#e8f4ff;border:1px solid #b8d6f0;transform:rotateY(180deg)}

.kana-front{font-size:clamp(2.8rem,6vw,5rem);font-weight:bold;color:#111;line-height:1.1;white-space:nowrap;text-align:center}
.kana-back{font-size:clamp(1.8rem,4vw,3.4rem);font-weight:bold;color:#111;line-height:1.1;white-space:nowrap;text-align:center}
.roma-back{font-size:32px;font-weight:600;color:#374151;margin-top:14px}

.btn{padding:12px 24px;margin:8px;font-size:15px;border:none;border-radius:12px;cursor:pointer;transition:transform .15s,box-shadow .15s;font-weight:600;letter-spacing:.5px}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.12)}
.b1{background:#0f7a40;color:#fff}
.b2{background:#10b981;color:#fff}
.b3{background:#f59e0b;color:#fff}
select{padding:8px 14px;font-size:15px;border-radius:10px;border:1px solid #d1d5db;background:#fff;color:#374151;cursor:pointer;outline:none}
select:focus{border-color:#0f7a40;box-shadow:0 0 0 3px rgba(15,122,64,.15)}
.back-btn{position:fixed;top:16px;left:20px;z-index:999;padding:8px 16px;background:rgba(255,255,255,.85);backdrop-filter:blur(4px);color:#0f7a40;font-size:14px;font-weight:600;border-radius:10px;border:1px solid #e5e7eb;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.08);transition:transform .15s,box-shadow .15s}
.back-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.12)}

/* ===== JR東日本風 カード美化 ===== */
.flip-card{
    width:180px;height:220px;border-radius:20px;
    transition:transform .3s cubic-bezier(.2,1.3,.3,1), box-shadow .3s;
    position:relative;
}
.flip-card:hover{
    transform:translateY(-6px) scale(1.02);
    box-shadow:0 16px 40px rgba(15,122,64,.18);
}
.flip-card-front, .flip-card-back{
    border-radius:20px!important;
    border:1px solid #d1fae5!important;
    box-shadow:0 8px 24px rgba(15,122,64,.10)!important;
    overflow:hidden;
    position:absolute;
}
.flip-card-front::before{
    content:'';position:absolute;top:-40px;right:-40px;width:100px;height:100px;
    border-radius:50%;background:#0f7a40;opacity:.06;
}
.flip-card-front::after{
    content:'';position:absolute;bottom:-30px;left:-30px;width:80px;height:80px;
    border-radius:50%;background:#0f7a40;opacity:.04;
}
.flip-card-front{
    background:linear-gradient(160deg,#ffffff 0%,#f0fdf4 100%)!important;
}
.flip-card-back{
    background:linear-gradient(160deg,#0f7a40 0%,#0a5c2f 100%)!important;
    border:1px solid #0a5c2f!important;
    box-shadow:0 12px 32px rgba(15,122,64,.28)!important;
}
.flip-card-back::after{
    content:'';position:absolute;top:0;left:0;width:100%;height:100%;
    background:linear-gradient(135deg,rgba(255,255,255,.10) 0%,transparent 50%);
    border-radius:20px;pointer-events:none;z-index:3;
}
.flip-card-back::before{
    content:'';position:absolute;top:0;left:0;width:100%;height:40%;
    background:linear-gradient(180deg,rgba(255,255,255,.12) 0%,transparent 100%);
    pointer-events:none;
}
.kana-front{
    font-size:clamp(2.8rem,6vw,5rem)!important;
    font-weight:700!important;
    color:#0f7a40!important;
    text-shadow:0 2px 0 rgba(15,122,64,.08);
}
.kana-back{
    font-size:clamp(1.8rem,4vw,3.4rem)!important;
    font-weight:700!important;
    color:#ffffff!important;
    text-shadow:0 2px 8px rgba(0,0,0,.2);
}
.roma-back{
    font-size:1.6rem!important;
    font-weight:600!important;
    color:#ffffff!important;
    margin-top:16px!important;
    padding:6px 18px;
    background:rgba(255,255,255,.18);
    border-radius:8px;
    letter-spacing:.08em;
    backdrop-filter:blur(2px);
}
/* カード全体の軽い光沢 */



/* ===== 翻転後の子要素透け問題 修正 ===== */
/* text-shadow 等で独立合成層が生成されると backface-visibility:hidden が効かない */
/* 子要素にも backface-visibility:hidden を付ける */
.flip-card-front > *,
.flip-card-back > *{
    -webkit-backface-visibility:hidden;
    backface-visibility:hidden;
}
/* text-shadow も消す（合成層生成のトリガー） */
.kana-front, .kana-back, .roma-back,
.card-kanji, .card-num{
    text-shadow:none !important;
}



/* 背景：首页草坡图（低透明度 + 高斯模糊） */
.page-bg{position:fixed;inset:0;z-index:0;background:#f8faf9 url('assets/hero-34-bg.jpg') center/cover no-repeat;opacity:.16;filter:blur(12px);transform:scale(1.06);pointer-events:none;}
body>*:not(.page-bg):not(.back-btn):not(.popup-wrap){position:relative;z-index:1;}
</style>
</head>
<body>
<div class="page-bg" aria-hidden="true"></div>
<a class="back-btn" href="./index.html">← ホーム</a>
<div class="wrap">
  <div class="ctrl">
    <div class="ctrl-group">
      <span class="ctrl-label">字体</span>
      <label><input type="radio" name="script" value="hira" checked> 平假名</label>
      <label><input type="radio" name="script" value="kata"> 片假名</label>
      <label><input type="radio" name="script" value="rand"> 随机</label>
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label">范围</span>
      <label><input type="checkbox" id="r-basic" checked> 清音</label>
      <label><input type="checkbox" id="r-daku" checked> 濁音・半濁音</label>
      <label><input type="checkbox" id="r-you" checked> 拗音</label>
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label">一次显示</span>
      <select id="countSel">
        <option value="1">1 文字</option>
        <option value="2">2 文字</option>
        <option value="3">3 文字</option>
        <option value="4">4 文字</option>
        <option value="5">5 文字</option>
        <option value="6">6 文字</option>
        <option value="7">7 文字</option>
        <option value="8">8 文字</option>
        <option value="9">9 文字</option>
        <option value="10">10 文字</option>
      </select>
    </div>
  </div>

  <div class="kana-area" id="box"></div>

  <div>
    <button class="btn b1" onclick="flipAllCards()">一括反転</button>
    <button class="btn b2" onclick="nextSet()">次のセット</button>
    <button class="btn b3" onclick="reset()">再生成</button>
  </div>
</div>

<script>
// 基本五十音
const gojuon = [
  {h:'あ',k:'ア',r:'a'},{h:'い',k:'イ',r:'i'},{h:'う',k:'ウ',r:'u'},{h:'え',k:'エ',r:'e'},{h:'お',k:'オ',r:'o'},
  {h:'か',k:'カ',r:'ka'},{h:'き',k:'キ',r:'ki'},{h:'く',k:'ク',r:'ku'},{h:'け',k:'ケ',r:'ke'},{h:'こ',k:'コ',r:'ko'},
  {h:'さ',k:'サ',r:'sa'},{h:'し',k:'シ',r:'shi'},{h:'す',k:'ス',r:'su'},{h:'せ',k:'セ',r:'se'},{h:'そ',k:'ソ',r:'so'},
  {h:'た',k:'タ',r:'ta'},{h:'ち',k:'チ',r:'chi'},{h:'つ',k:'ツ',r:'tsu'},{h:'て',k:'テ',r:'te'},{h:'と',k:'ト',r:'to'},
  {h:'な',k:'ナ',r:'na'},{h:'に',k:'ニ',r:'ni'},{h:'ぬ',k:'ヌ',r:'nu'},{h:'ね',k:'ネ',r:'ne'},{h:'の',k:'ノ',r:'no'},
  {h:'は',k:'ハ',r:'ha'},{h:'ひ',k:'ヒ',r:'hi'},{h:'ふ',k:'フ',r:'fu'},{h:'へ',k:'ヘ',r:'he'},{h:'ほ',k:'ホ',r:'ho'},
  {h:'ま',k:'マ',r:'ma'},{h:'み',k:'ミ',r:'mi'},{h:'む',k:'ム',r:'mu'},{h:'め',k:'メ',r:'me'},{h:'も',k:'モ',r:'mo'},
  {h:'や',k:'ヤ',r:'ya'},{h:'ゆ',k:'ユ',r:'yu'},{h:'よ',k:'ヨ',r:'yo'},
  {h:'ら',k:'ラ',r:'ra'},{h:'り',k:'リ',r:'ri'},{h:'る',k:'ル',r:'ru'},{h:'れ',k:'レ',r:'re'},{h:'ろ',k:'ロ',r:'ro'},
  {h:'わ',k:'ワ',r:'wa'},{h:'を',k:'ヲ',r:'wo'},{h:'ん',k:'ン',r:'n'}
];

// 濁音・半濁音
const dakuon = [
  {h:'が',k:'ガ',r:'ga'},{h:'ぎ',k:'ギ',r:'gi'},{h:'ぐ',k:'グ',r:'gu'},{h:'げ',k:'ゲ',r:'ge'},{h:'ご',k:'ゴ',r:'go'},
  {h:'ざ',k:'ザ',r:'za'},{h:'じ',k:'ジ',r:'ji'},{h:'ず',k:'ズ',r:'zu'},{h:'ぜ',k:'ゼ',r:'ze'},{h:'ぞ',k:'ゾ',r:'zo'},
  {h:'だ',k:'ダ',r:'da'},{h:'ぢ',k:'ヂ',r:'ji'},{h:'づ',k:'ヅ',r:'zu'},{h:'で',k:'デ',r:'de'},{h:'ど',k:'ド',r:'do'},
  {h:'ば',k:'バ',r:'ba'},{h:'び',k:'ビ',r:'bi'},{h:'ぶ',k:'ブ',r:'bu'},{h:'べ',k:'ベ',r:'be'},{h:'ぼ',k:'ボ',r:'bo'},
  {h:'ぱ',k:'パ',r:'pa'},{h:'ぴ',k:'ピ',r:'pi'},{h:'ぷ',k:'プ',r:'pu'},{h:'ぺ',k:'ペ',r:'pe'},{h:'ぽ',k:'ポ',r:'po'}
];

// 拗音（ようおん）
const youon = [
  {h:'きゃ',k:'キャ',r:'kya'},{h:'きゅ',k:'キュ',r:'kyu'},{h:'きょ',k:'キョ',r:'kyo'},
  {h:'しゃ',k:'シャ',r:'sha'},{h:'しゅ',k:'シュ',r:'shu'},{h:'しょ',k:'ショ',r:'sho'},
  {h:'ちゃ',k:'チャ',r:'cha'},{h:'ちゅ',k:'チュ',r:'chu'},{h:'ちょ',k:'チョ',r:'cho'},
  {h:'にゃ',k:'ニャ',r:'nya'},{h:'にゅ',k:'ニュ',r:'nyu'},{h:'にょ',k:'ニョ',r:'nyo'},
  {h:'ひゃ',k:'ヒャ',r:'hya'},{h:'ひゅ',k:'ヒュ',r:'hyu'},{h:'ひょ',k:'ヒョ',r:'hyo'},
  {h:'みゃ',k:'ミャ',r:'mya'},{h:'みゅ',k:'ミュ',r:'myu'},{h:'みょ',k:'ミョ',r:'myo'},
  {h:'りゃ',k:'リャ',r:'rya'},{h:'りゅ',k:'リュ',r:'ryu'},{h:'りょ',k:'リョ',r:'ryo'},
  {h:'ぎゃ',k:'ギャ',r:'gya'},{h:'ぎゅ',k:'ギュ',r:'gyu'},{h:'ぎょ',k:'ギョ',r:'gyo'},
  {h:'じゃ',k:'ジャ',r:'ja'},{h:'じゅ',k:'ジュ',r:'ju'},{h:'じょ',k:'ジョ',r:'jo'},
  {h:'びゃ',k:'ビャ',r:'bya'},{h:'びゅ',k:'ビュ',r:'byu'},{h:'びょ',k:'ビョ',r:'byo'},
  {h:'ぴゃ',k:'ピャ',r:'pya'},{h:'ぴゅ',k:'ピュ',r:'pyu'},{h:'ぴょ',k:'ピョ',r:'pyo'}
];

let currentList = [];
let allFlipped = false; // 记录全体卡片翻转状态
const box = document.getElementById('box');
const scriptRadios = document.querySelectorAll('input[name="script"]');
const basicCb = document.getElementById('r-basic');
const dakuCb = document.getElementById('r-daku');
const youCb = document.getElementById('r-you');
const sel = document.getElementById('countSel');

// 字体模式：hira=平假名, kata=片假名, rand=随机
function getScriptMode(){
  let mode = 'hira';
  scriptRadios.forEach(r=>{ if(r.checked) mode = r.value; });
  return mode;
}

function getRandomPool(){
  let pool = [];
  if(basicCb.checked) pool = pool.concat(gojuon);
  if(dakuCb.checked) pool = pool.concat(dakuon);
  if(youCb.checked) pool = pool.concat(youon);
  return pool;
}

function getRandom(arr, num){
  let res = [];
  let copy = [...arr];
  for(let i=0;i<num && copy.length>0;i++){
    let idx = Math.floor(Math.random()*copy.length);
    res.push(copy.splice(idx,1)[0]);
  }
  return res;
}

function render(){
  let cnt = Number(sel.value);
  let pool = getRandomPool();
  let mode = getScriptMode();
  box.innerHTML = '';
  allFlipped = false; // 新生成卡片默认全部正面

  if(pool.length === 0){
    box.innerHTML = '<div style="font-size:24px;color:red;">少なくとも1つの範囲を選択してください</div>';
    currentList = [];
    return;
  }

  currentList = getRandom(pool, cnt);
  currentList.forEach(item=>{
    // 字体：随机模式下每张卡独立决定平/片假名
    let t = mode === 'hira' ? 'h' : 'k';
    if(mode === 'rand') t = Math.random() < 0.5 ? 'h' : 'k';
    let charFront = t === 'h' ? item.h : item.k;

    let flipCard = document.createElement('div');
    flipCard.className = 'flip-card';
    flipCard.innerHTML = `
      <div class="flip-card-inner">
        <div class="flip-card-front">
          <div class="kana-front">${charFront}</div>
        </div>
        <div class="flip-card-back">
          <div class="kana-back">${charFront}</div>
          <div class="roma-back">${item.r}</div>
        </div>
      </div>
    `;
    // 单机卡片单独翻转
    flipCard.addEventListener('click', ()=>{
      flipCard.classList.toggle('flipped');
    })
    box.appendChild(flipCard);
  })
}

// 一键批量翻转所有卡片
function flipAllCards(){
  allFlipped = !allFlipped;
  const cards = document.querySelectorAll('.flip-card');
  cards.forEach(card=>{
    if(allFlipped){
      card.classList.add('flipped');
    }else{
      card.classList.remove('flipped');
    }
  })
}

function nextSet(){ render() }
function reset(){ render() }

sel.onchange = ()=>render();
scriptRadios.forEach(r=> r.onchange = ()=>render());
basicCb.onchange = ()=>render();
dakuCb.onchange = ()=>render();
youCb.onchange = ()=>render();

render();
</script>
</body>
</html>
