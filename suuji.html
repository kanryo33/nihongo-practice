<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本語数字・日付・時刻練習</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Meiryo","メイリオ","Noto Sans JP",system-ui,sans-serif;color:#1f2937}
body{min-height:100vh;background:#f8faf9;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px}
.main-display{text-align:center;margin-bottom:48px;min-height:180px;background:#fff;padding:40px 48px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.08);border:1px solid #e5e7eb;max-width:900px;width:100%}
.yomi-line{font-size:28px;letter-spacing:4px;color:#4b5563;margin-bottom:12px;min-height:40px;font-weight:500}
.question-line{font-size:clamp(3rem,10vw,5.5rem);font-weight:700;color:#111}
.button-area{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:900px}
button{padding:12px 24px;font-size:15px;border:none;border-radius:12px;cursor:pointer;transition:transform .15s,box-shadow .15s,opacity .15s;font-weight:600;letter-spacing:.5px;color:#fff}
button:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.15)}
button:active{transform:translateY(0)}
.btn-orange{background:#f59e0b}
.btn-blue{background:#0f7a40}
.btn-green{background:#10b981}
.btn-gray{background:#6b7280}
.popup-wrap{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,.45);backdrop-filter:blur(4px);align-items:center;justify-content:center;z-index:100}
.popup-box{background:#fff;padding:36px;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.2);border:1px solid #e5e7eb;max-width:460px;width:calc(100% - 40px)}
.popup-box > div{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;justify-content:center}
.popup-box button{padding:10px 18px;font-size:14px;border-radius:10px}
.back-btn{position:fixed;top:16px;left:20px;z-index:999;padding:8px 16px;background:rgba(255,255,255,.85);backdrop-filter:blur(4px);color:#0f7a40;font-size:14px;font-weight:600;border-radius:10px;border:1px solid #e5e7eb;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.08);transition:transform .15s,box-shadow .15s}
.back-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.12)}

/* ===== JREast 風 追加装飾 ===== */
body{background:#f8faf9!important;}
.hero-tool{position:relative;width:100%;height:90px;overflow:hidden;margin-bottom:8px;pointer-events:none;}
.hero-tool-wave{position:absolute;bottom:-10px;left:0;width:100%;height:140px;z-index:1;}
.hero-tool-dot{position:absolute;z-index:2;}
.hero-tool-dot-1{top:24px;left:12%;}
.hero-tool-dot-2{top:36px;right:18%;}
.hero-tool-ring{position:absolute;z-index:2;}
.hero-tool-ring-1{top:14px;right:8%;}
/* wrap / main-display 美化 */
.wrap{box-shadow:0 4px 24px rgba(15,122,64,.08)!important;border:1px solid #e5e7eb!important;border-top:3px solid #0f7a40!important;border-radius:16px!important;}
.main-display{box-shadow:0 4px 24px rgba(15,122,64,.08)!important;border:1px solid #e5e7eb!important;border-top:3px solid #0f7a40!important;border-radius:16px!important;}
/* 返却ボタン */
.back-btn{background:rgba(255,255,255,.95)!important;color:#0f7a40!important;border:1px solid #d1fae5!important;box-shadow:0 2px 12px rgba(15,122,64,.12)!important;font-weight:700!important;}
.back-btn:hover{box-shadow:0 4px 18px rgba(15,122,64,.2)!important;transform:translateY(-1px)!important;}
/* ボタン統一：全て JR緑 系 */
.b1{background:#0f7a40!important;}
.b2{background:#16a34a!important;}
.b3{background:#65a30d!important;}
.b4{background:#6b7280!important;}
.btn-blue{background:#0f7a40!important;}
.btn-green{background:#16a34a!important;}
.btn-orange{background:#65a30d!important;}
/* flip-card 裏面も緑 */
.flip-card-back{background:#0f7a40!important;border-color:#0a5c2f!important;}
/* select フォーカスリング */
select:focus{border-color:#0f7a40!important;box-shadow:0 0 0 3px rgba(15,122,64,.15)!important;}
/* h1 も緑アクセント */
.wrap > h1{color:#111827!important;position:relative;padding-bottom:14px;}
.wrap > h1::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:36px;height:3px;background:#0f7a40;border-radius:2px;}

</style>
</head>
<body>
<!-- Hero 波打つ曲線装饰 -->
<div class="hero-tool">
    <svg class="hero-tool-wave" viewBox="0 0 1440 120" fill="none" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 80 Q 180 20 360 60 T 720 50 T 1080 70 T 1440 40 L1440 120 L0 120Z" fill="#0f7a40" fill-opacity="0.07"/>
        <path d="M0 100 Q 220 55 440 80 T 880 70 T 1320 85 L1440 80 L1440 120 L0 120Z" fill="#0f7a40" fill-opacity="0.05"/>
    </svg>
    <svg class="hero-tool-dot hero-tool-dot-1" width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="#0f7a40" fill-opacity="0.3"/></svg>
    <svg class="hero-tool-dot hero-tool-dot-2" width="10" height="10" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="#0f7a40" fill-opacity="0.2"/></svg>
    <svg class="hero-tool-ring hero-tool-ring-1" width="36" height="36" viewBox="0 0 36 36"><circle cx="18" cy="18" r="14" fill="none" stroke="#0f7a40" stroke-width="1.5" stroke-opacity="0.2"/></svg>
</div>

<a class="back-btn" href="./index.html">← ホーム</a>
<div class="main-display" id="displayBox">
    <div class="yomi-line" id="yomiBox"></div>
    <div class="question-line" id="textBox">ボタンを押して問題を生成</div>
</div>

<div class="button-area">
    <button class="btn-orange" onclick="openDigitSelect()">数字（桁選択）</button>
    <button class="btn-blue" onclick="generateDate()">年月日</button>
    <button class="btn-blue" onclick="generateTime()">時刻（時:分）</button>
    <button class="btn-green" onclick="toggleYomi()">読み方表示</button>
    <button class="btn-gray" onclick="nextQuestion()">次へ</button>
    <button class="btn-gray" onclick="resetAll()">リセット</button>
</div>

<div class="popup-wrap" id="digitPopup">
    <div class="popup-box">
        <div>
            <button onclick="setDigit(1)">1桁</button>
            <button onclick="setDigit(2)">2桁</button>
            <button onclick="setDigit(3)">3桁</button>
            <button onclick="setDigit(4)">4桁</button>
            <button onclick="setDigit(5)">5桁</button>
            <button onclick="setDigit(6)">6桁</button>
            <button onclick="setDigit(7)">7桁</button>
            <button onclick="setDigit(8)">8桁</button>
        </div>
    </div>
</div>

<script>
let currentMode = null;
let targetDigit = 4;
let rawData = {};
let showYomi = false;

// 桁ポップアップ
function openDigitSelect(){
    document.getElementById("digitPopup").style.display="flex";
}
function setDigit(n){
    targetDigit = n;
    document.getElementById("digitPopup").style.display="none";
    generateNumber();
}

// リセット
function resetAll(){
    rawData = {};
    showYomi = false;
    currentMode = null;
    document.getElementById("yomiBox").innerText = "";
    document.getElementById("textBox").innerText = "ボタンを押して問題を生成";
}

// 次の問題
function nextQuestion(){
    if(currentMode==="num") generateNumber();
    else if(currentMode==="date") generateDate();
    else if(currentMode==="time") generateTime();
}

// 読み方切替
function toggleYomi(){
    showYomi = !showYomi;
    renderDisplay();
}

// ======== 数字変換ロジック（日本語式4桁グループ化）========
const numYomiBase = ["れい","いち","に","さん","よん","ご","ろく","なな","はち","きゅう"];
// 4桁グループの名前（右から4桁ごと）
const groupName = ["", "まん", "おく", "ちょう"]; // 0=なし, 1=万, 2=億, 3=兆

// 4桁グループ内部を読む（例: "903" → "きゅうひゃくさん"）
function readOneGroup(s4){
    // s4 は 1-4 桁の文字列（先頭の0は含まない）
    let res = [];
    const len = s4.length;
    for(let i=0; i<len; i++){
        const d = parseInt(s4[i]);
        const pos = len - i - 1; // 0=一, 1=十, 2=百, 3=千
        if(d === 0) continue;
        res.push(numYomiBase[d]);
        if(pos === 3) res.push("せん");
        else if(pos === 2) res.push("ひゃく");
        else if(pos === 1) res.push("じゅう");
    }
    return res.join("");
}

function numToReading(num){
    if(num === 0) return "れい";
    let s = num.toString();
    // 右から4桁ごとに区切る
    let groups = [];
    while(s.length > 0){
        if(s.length <= 4){
            groups.unshift(s);
            s = "";
        } else {
            groups.unshift(s.slice(-4));
            s = s.slice(0, -4);
        }
    }
    // groups[0] が最上位、groupName[groupIdx] を付ける
    let result = [];
    for(let g=0; g<groups.length; g++){
        const gnum = groups[g];
        const gval = parseInt(gnum);
        if(gval === 0) continue; // 0000 グループはスキップ
        const yomi = readOneGroup(gnum);
        const groupIdx = groups.length - 1 - g; // 右から何番目のグループか
        result.push(yomi + groupName[groupIdx]);
    }
    return result.join(" ");
}

// 数字問題
function generateNumber(){
    currentMode = "num";
    const min = 10 ** (targetDigit-1);
    const max = (10 ** targetDigit)-1;
    const val = Math.floor(Math.random()*(max-min+1))+min;
    rawData = {
        type:"num",
        text:val.toLocaleString(),
        yomi:numToReading(val)
    };
    renderDisplay();
}

// ======== 年月日生成 ========
function generateDate(){
    currentMode = "date";
    const year = Math.floor(Math.random()*(2035-1950+1))+1950;
    const month = Math.floor(Math.random()*12)+1;
    let dayMax;
    if([1,3,5,7,8,10,12].includes(month)) dayMax=31;
    else if([4,6,9,11].includes(month)) dayMax=30;
    else dayMax=28;
    const day = Math.floor(Math.random()*dayMax)+1;

    const monthRead = ["","いちがつ","にがつ","さんがつ","しがつ","ごがつ","ろくがつ","しちがつ","はちがつ","くがつ","じゅうがつ","じゅういちがつ","じゅうにがつ"];
    const dayRead = getDayReading(day);
    const fullYomi = `${numToReading(year)} ねん ${monthRead[month]} ${dayRead}`;

    rawData = {
        type:"date",
        text:`${year}年${month}月${day}日`,
        yomi: fullYomi
    };
    renderDisplay();
}

// 日付特殊読み
function getDayReading(d){
    const sp = {
        1:"ついたち",2:"ふつか",3:"みっか",4:"よっか",5:"いつか",6:"むいか",7:"なのか",8:"ようか",9:"ここのか",10:"とおか",
        14:"じゅうよっか",20:"はつか",24:"にじゅうよっか"
    };
    if(sp[d]) return sp[d];
    if(d <= 10) return numToReading(d)+" か";
    return numToReading(d)+" にち";
}

// ======== 時刻 ========
function generateTime(){
    currentMode = "time";
    const h = Math.floor(Math.random()*24);
    const m = Math.floor(Math.random()*60);
    const hStr = String(h).padStart(2,"0");
    const mStr = String(m).padStart(2,"0");
    let hYomi = numToReading(h);
    let mYomi = numToReading(m);
    let minuteBase = mYomi + " ふん";
    minuteBase = minuteBase.replace("さん ふん","さんぷん")
                 .replace("ろく ふん","ろっぷん")
                 .replace("はち ふん","はっぷん");
    const fullYomi = `${hYomi} じ ${minuteBase}`;

    rawData = {
        type:"time",
        text:`${hStr}:${mStr}`,
        yomi: fullYomi
    };
    renderDisplay();
}

// ======== 描画処理：読み方を独立1行に配置（重なり完全解消） ========
function renderDisplay(){
    const yomiBox = document.getElementById("yomiBox");
    const textBox = document.getElementById("textBox");
    if(!rawData.type){
        yomiBox.innerText = "";
        textBox.innerText = "ボタンを押して問題を生成";
        return;
    }

    textBox.innerText = rawData.text;
    if(showYomi){
        yomiBox.innerText = rawData.yomi;
    }else{
        yomiBox.innerText = "";
    }
}
</script>
</body>
</html>
