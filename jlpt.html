  --primary-deep: #0c6334;
  --primary-soft: #e8f5ee;
  --ok: #1e9e62;
  --ok-soft: #e8f7ee;
  --bad: #e0463f;
  --bad-soft: #fdecea;
  --accent: #0f7a40;
  --accent-soft: #e8f5ee;
  --topbar-h: 78px;
  --barbar-h: 100px;
  --radius: 22px;
  --shadow-xs: 0 1px 3px rgba(23, 32, 60, .05);
  --shadow-sm: 0 4px 14px rgba(23, 32, 60, .07);
  --shadow-md: 0 14px 36px rgba(23, 32, 60, .13);
  --grad-main: linear-gradient(135deg, #1aa05a 0%, #0f7a40 55%, #0c6334 100%);
  --level-n5: #2f9e6f;
  --level-n4: #2f8fe0;
  --level-n3: #d99a1b;
  --level-n2: #e8722f;
  --level-n1: #d6453b;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, "Noto Sans JP", "Noto Sans CJK JP", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  background: #f8faf9;
  color: var(--ink);
  font-size: 20px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  position: relative;
}
button { font-family: inherit; cursor: pointer; }
a { text-decoration: none; color: inherit; }

/* ---------------- 通用按钮 ---------------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  border: 2px solid var(--line);
  background: var(--card);
  color: var(--ink);
  border-radius: 16px;
  font-size: 21px;
  font-weight: 700;
  padding: 11px 24px;
  box-shadow: var(--shadow-xs);
  transition: transform .16s ease, box-shadow .22s ease, border-color .16s ease, background .16s ease, color .16s ease;
}
.btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: rgba(15, 122, 64, .45); }
.btn:active { transform: translateY(0) scale(.97); }
.btn.primary {
  background: var(--grad-main);
  border-color: transparent;
  color: #fff;
  box-shadow: 0 10px 26px rgba(15, 122, 64, .32);
}
.btn.primary:hover { filter: brightness(1.06); box-shadow: 0 14px 34px rgba(15, 122, 64, .42); }
.btn.big { height: 66px; font-size: 24px; padding: 0 34px; border-radius: 18px; }
.btn.start {
  height: 80px;
  font-size: 28px;
  padding: 0 60px;
  border-radius: 24px;
  background: var(--grad-main);
  border-color: transparent;
  color: #fff;
  box-shadow: 0 14px 34px rgba(15, 122, 64, .38);
  letter-spacing: 2px;
}
.btn.start:hover { filter: brightness(1.06); box-shadow: 0 18px 44px rgba(15, 122, 64, .48); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none !important; box-shadow: var(--shadow-xs) !important; }

/* ---------------- 选题视图 ---------------- */
#view-select { min-height: 100vh; }
.sel-top {
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 30px 0 150px;
  background: rgba(255, 255, 255, .86);
  border-bottom: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  position: sticky;
  top: 0;
  z-index: 10;
  backdrop-filter: saturate(150%) blur(10px);
}
.brand { display: flex; align-items: center; gap: 14px; }
.brand img { height: 44px; width: auto; border-radius: 9px; box-shadow: var(--shadow-xs); }
.brand span { font-size: 24px; font-weight: 800; letter-spacing: .5px; }
.sel-main { max-width: 1120px; margin: 0 auto; padding: 36px 30px 64px; }
.sel-head { text-align: center; margin-bottom: 30px; }
.sel-head h1 { margin: 0; font-size: 44px; font-weight: 900; letter-spacing: 2px; }
.sel-head p { margin: 10px 0 0; color: var(--ink-soft); font-size: 19px; }
.filter-block {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  padding: 22px 30px 28px;
  margin: 18px 0;
}
.filter-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.filter-head h2 {
  margin: 0;
  font-size: 23px;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  gap: 12px;
}
.filter-head h2::before {
  content: "";
  width: 10px; height: 26px;
  border-radius: 6px;
  background: var(--grad-main);
}
.mini {
  border: 1.5px solid var(--line);
  background: var(--card);
  color: var(--ink-soft);
  font-size: 18px;
  font-weight: 700;
  padding: 8px 18px;
  border-radius: 12px;
  transition: all .15s ease;
}
.mini:hover { border-color: var(--primary); color: var(--primary-deep); transform: translateY(-1px); }
.chips { display: flex; flex-wrap: wrap; gap: 13px; }
.chip {
  border: 2px solid var(--line);
  background: var(--card);
  color: var(--ink);
  border-radius: 999px;
  font-size: 22px;
  font-weight: 700;
  padding: 12px 30px;
  box-shadow: var(--shadow-xs);
  transition: all .16s ease;
}
.chip:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.chip.active {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
  box-shadow: 0 8px 20px rgba(15, 122, 64, .3);
}
.chip.lv-n5.active { background: var(--level-n5); border-color: var(--level-n5); box-shadow: 0 8px 20px rgba(47, 158, 111, .3); }
.chip.lv-n4.active { background: var(--level-n4); border-color: var(--level-n4); box-shadow: 0 8px 20px rgba(47, 143, 224, .3); }
.chip.lv-n3.active { background: var(--level-n3); border-color: var(--level-n3); box-shadow: 0 8px 20px rgba(217, 154, 27, .32); }
.chip.lv-n2.active { background: var(--level-n2); border-color: var(--level-n2); box-shadow: 0 8px 20px rgba(232, 114, 47, .3); }
.chip.lv-n1.active { background: var(--level-n1); border-color: var(--level-n1); box-shadow: 0 8px 20px rgba(214, 69, 59, .3); }
.chip-hint { color: var(--ink-faint); font-size: 19px; }
.sel-stat {
  text-align: center;
  margin: 28px 0 16px;
  display: block;
  width: 100%;
  font-size: 24px;
  font-weight: 800;
  color: var(--ink-soft);
}
.sel-stat b { color: var(--primary-deep); font-size: 30px; }
.sel-stat small { color: var(--ink-faint); font-weight: 600; }
.sel-actions { display: flex; gap: 22px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }

/* ---------------- 演示视图 ---------------- */
#view-demo { height: 100vh; display: flex; flex-direction: column; }
.demo-top {
  height: var(--topbar-h);
  flex: none;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 26px 0 150px;
  background: rgba(255, 255, 255, .92);
  border-bottom: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  backdrop-filter: saturate(150%) blur(10px);
}
.demo-title { font-size: 22px; font-weight: 800; white-space: nowrap; color: var(--ink-soft); }
.demo-meta {
  flex: 1;
  text-align: center;
  font-size: 21px;
  font-weight: 800;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.demo-progress {
  font-size: 21px;
  font-weight: 900;
  color: var(--primary-deep);
  background: var(--primary-soft);
  border: 1.5px solid rgba(15, 122, 64, .25);
  border-radius: 999px;
  padding: 6px 20px;
  white-space: nowrap;
}
.progress-track { flex: none; height: 7px; background: var(--line); }
.progress-fill { height: 100%; width: 0; background: var(--grad-main); transition: width .3s ease; }

.demo-main {
  flex: 1;
  overflow: auto;
  padding: 22px clamp(18px, 3.5vw, 56px) 28px;
  scroll-behavior: smooth;
}
.demo-inner { max-width: 1240px; margin: 0 auto; }

/* 题头 */
.q-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.badge {
  display: inline-flex;
  align-items: center;
  border-radius: 999px;
  font-size: 20px;
  font-weight: 800;
  padding: 7px 18px;
  color: #fff;
  box-shadow: var(--shadow-xs);
}
.badge.lv { background: var(--lv, var(--primary)); }
.badge.prob { background: var(--ink); }
.badge.cat { background: var(--accent); }
.badge.src { background: var(--ink-soft); }
.q-type {
  color: var(--ink-soft);
  font-size: 19px;
  font-weight: 600;
  margin: 0 0 16px;
  padding-left: 2px;
}

/* 音频：自定义播放器（跨设备：进度条恒显示、可点击/拖动/触屏拖动） */
.q-audio {
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  padding: 16px 20px;
  margin: 0 0 18px;
}
.q-audio audio { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.ap-bar { display: flex; align-items: center; gap: 18px; min-width: 0; }
.ap-play {
  flex: none;
  width: 64px; height: 64px;
  border-radius: 50%;
  border: none;
  background: var(--grad-main);
  color: #fff;
  font-size: 25px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 18px rgba(15, 122, 64, .32);
  transition: transform .15s ease, filter .15s ease;
}
.ap-play:hover { filter: brightness(1.07); transform: scale(1.04); }
.ap-play:active { transform: scale(.96); }
.ap-track {
  flex: 1;
  height: 16px;
  background: #e4e8f2;
  border-radius: 999px;
  position: relative;
  cursor: pointer;
  touch-action: none;
  min-width: 0;
}
.ap-fill {
  position: absolute; left: 0; top: 0;
  height: 100%; width: 0;
  background: var(--grad-main);
  border-radius: 999px;
  pointer-events: none;
}
.ap-thumb {
  position: absolute; top: 50%; left: 0;
  width: 30px; height: 30px;
  border-radius: 50%;
  background: #fff;
  border: 3px solid var(--primary);
  transform: translate(-50%, -50%);
  box-shadow: 0 2px 8px rgba(23, 32, 60, .25);
  pointer-events: none;
}
.ap-time {
  flex: none;
  font-size: 21px;
  font-weight: 800;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.ap-err {
  color: var(--bad);
  font-size: 17px;
  font-weight: 700;
  margin-left: auto;
}

/* 题干图片（普通题） */
.q-image { text-align: center; margin: 0 0 18px; }
.q-image img {
  max-width: 100%;
  max-height: 40vh;
  border-radius: var(--radius);
  border: 1.5px solid var(--line);
  box-shadow: var(--shadow-sm);
}

/* 文章（读解） */
.q-article {
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  margin: 0 0 12px;
}
.a-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 24px 0;
}
.a-label {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 2px;
  color: var(--accent);
  background: var(--accent-soft);
  border-radius: 999px;
  padding: 5px 16px;
}
.a-toggle {
  border: none;
  background: none;
  color: var(--accent);
  font-size: 18px;
  font-weight: 800;
  padding: 8px 14px;
  border-radius: 12px;
  transition: background .15s ease;
}
.a-toggle:hover { background: var(--accent-soft); }
.a-body {
  padding: 14px 26px 22px;
  font-size: 29px;
  line-height: 1.75;
  max-height: 24vh;
  overflow-y: auto;
}
.q-article.expanded .a-body { max-height: none; overflow: visible; }
.a-body::-webkit-scrollbar { width: 10px; }
.a-body::-webkit-scrollbar-thumb { background: #cdd5e6; border-radius: 999px; }
.a-body::-webkit-scrollbar-track { background: transparent; }
.a-body u { text-decoration-thickness: 2px; text-underline-offset: 3px; }

/* 题干 */
.q-stem {
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  padding: 18px 26px;
  margin: 0 0 12px;
  font-size: clamp(28px, 2.7vw, 38px);
  font-weight: 800;
  line-height: 1.5;
}
.q-stem .qn { color: var(--primary-deep); font-weight: 900; margin-right: 10px; }
.q-stem u { text-decoration-thickness: 2.5px; text-underline-offset: 4px; }

/* 选项 */
.q-opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin: 0 0 12px; }
/* 文字词汇/文法：选项字号与题干一致 */
.q-opts.opts-lg .opt { font-size: clamp(28px, 2.7vw, 38px); }
.opt {
  position: relative;
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: 20px;
  box-shadow: var(--shadow-sm);
  padding: 16px 20px;
  font-size: clamp(19px, 1.7vw, 24px);
  font-weight: 700;
  cursor: pointer;
  transition: transform .16s ease, box-shadow .22s ease, border-color .16s ease, background .16s ease;
}
.opt:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: rgba(15, 122, 64, .5); }
.opt .on {
  flex: none;
  width: 50px; height: 50px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  background: #f2f4fa;
  border: 2px solid #dfe4f0;
  font-size: 23px;
  font-weight: 900;
  color: #5a6478;
}
.opt .ot { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.opt u { text-decoration-thickness: 2px; text-underline-offset: 3px; }
.opt img { max-width: 100%; max-height: 30vh; border-radius: 14px; flex: 1; }
.opt .ok-badge {
  position: absolute;
  top: -14px; right: 20px;
  background: var(--ok);
  color: #fff;
  font-size: 17px;
  font-weight: 900;
  letter-spacing: 1px;
  border-radius: 999px;
  padding: 4px 16px;
  box-shadow: 0 6px 16px rgba(30, 158, 98, .4);
}
.opt.correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.correct .on { background: var(--ok); border-color: var(--ok); color: #fff; }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .on { background: var(--bad); border-color: var(--bad); color: #fff; }

/* 听解带图：左图右信息（图片大，与选项同屏） */
.q-listen { display: grid; grid-template-columns: minmax(0, 58%) minmax(0, 42%); gap: 20px; align-items: stretch; }
.q-listen .q-image {
  margin: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  padding: 4px;
  width: 100%;
  align-self: start;
}
.q-listen .q-image img {
  width: 100%;
  max-width: 100%;
  max-height: calc(100vh - var(--topbar-h) - var(--barbar-h) - 24px);
  object-fit: contain;
}
.q-listen-right { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.q-listen-right .q-audio { margin: 0; }
.q-listen-right .q-stem { margin: 0; font-size: clamp(20px, 1.8vw, 25px); }
.q-listen-right .q-opts { grid-template-columns: repeat(auto-fit, minmax(195px, 1fr)); margin: 0; }

/* 答案区 */
.q-answer {
  background: var(--card);
  border: 3px solid var(--ok);
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  padding: 22px 28px;
  margin: 0 0 18px;
}
.ans-badge {
  display: inline-block;
  background: var(--ok);
  color: #fff;
  font-size: 23px;
  font-weight: 900;
  border-radius: 14px;
  padding: 8px 22px;
  margin-bottom: 14px;
  box-shadow: 0 6px 16px rgba(30, 158, 98, .3);
}
.ans-exp { font-size: 21px; line-height: 1.68; color: var(--ink); }
.ans-exp u { text-decoration-thickness: 2px; text-underline-offset: 3px; }
details.ans-trans {
  margin-top: 16px;
  border-top: 2px dashed var(--line);
  padding-top: 12px;
  font-size: 19px;
  color: var(--ink-soft);
}
details.ans-trans summary { font-weight: 800; cursor: pointer; color: var(--primary-deep); font-size: 23px; }
details.ans-trans .tr-jp { margin-top: 10px; font-size: 28px; font-weight: 800; line-height: 1.7; color: var(--ink); }
details.ans-trans .tr-zh { margin-top: 12px; font-size: 18px; line-height: 1.6; color: var(--ink-soft); }

/* 底部控制栏 */
.demo-bar {
  flex: none;
  height: var(--barbar-h);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding: 0 26px;
  background: rgba(255, 255, 255, .92);
  border-top: 1px solid var(--line);
  box-shadow: 0 -4px 18px rgba(23, 32, 60, .05);
  backdrop-filter: saturate(150%) blur(10px);
}
.kbd-hint { color: var(--ink-faint); font-size: 16px; }

.q-stem.stem-listen { font-size: 19px; font-weight: 700; color: var(--ink-soft); }
.q-stem.stem-reading { font-size: clamp(19px, 1.7vw, 24px); font-weight: 700; }
.q-opts.opts-2col { grid-template-columns: repeat(2, minmax(0, 1fr)); }

@media (max-width: 860px) {
  .sel-top, .demo-top { padding-left: 12px; }
  .back-btn { display: none; }
  body { font-size: 16px; }
  .demo-title { display: none; }
  .demo-meta { font-size: 16px; }
  .btn.big { height: 54px; font-size: 19px; padding: 0 18px; }
  .btn.start { height: 64px; font-size: 23px; padding: 0 34px; }
  .chip { font-size: 18px; padding: 10px 20px; }
  .q-listen { grid-template-columns: 1fr; }
  .q-opts, .q-opts.opts-2col { grid-template-columns: 1fr; }
  .opt { font-size: 18px; }
  .a-body { font-size: 24px; }
}

/* ---- 工具箱统一：模糊草坡背景 + 返回首页 ---- */
.page-bg{position:fixed;inset:0;z-index:0;background:#f8faf9 url('assets/hero-34-bg.jpg') center/cover no-repeat;opacity:.16;filter:blur(12px);transform:scale(1.06);pointer-events:none;}
body>*:not(.page-bg):not(.back-btn):not(.popup-wrap){position:relative;z-index:1;}
.back-btn{position:fixed;top:16px;left:20px;z-index:10000;padding:8px 16px;background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#0f7a40;font-size:14px;font-weight:700;text-decoration:none;border-radius:12px;border:1px solid rgba(15,122,64,.25);box-shadow:0 4px 14px rgba(0,0,0,.10);transition:transform .15s,box-shadow .15s;letter-spacing:.02em;}
.back-btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(15,122,64,.18);}
</style>
</head>
<body>
<div class="page-bg" aria-hidden="true"></div>
<a class="back-btn" href="./index.html">← ホーム</a>

<!-- ===== 视图一：选题 ===== -->
<div id="view-select">

        <h2>分野</h2>
        <button class="mini" id="toggle-category" type="button">すべて選択 / クリア</button>
      </div>
      <div class="chips" id="sel-category"></div>
    </section>

    <section class="filter-block">
      <div class="filter-head">
        <h2>試験回</h2>
        <button class="mini" id="toggle-year" type="button">すべて選択 / クリア</button>
      </div>
      <div class="chips" id="sel-year"></div>
    </section>

    <div class="sel-stat" id="sel-stat"></div>
    <div class="sel-actions">
      <button class="btn start" id="btn-start" type="button">デモを開始</button>
      <button class="btn big" id="btn-random" type="button">ランダムに1問</button>
    </div>
  </main>
</div>

<!-- ===== 视图二：演示 ===== -->
<div id="view-demo" hidden>
  <header class="demo-top">
    <button class="btn" id="btn-back" type="button">選択に戻る</button>
    <div class="demo-title">JLPT 题库</div>
    <div class="demo-meta" id="demo-meta"></div>
    <div class="demo-progress" id="demo-progress"></div>
    <button class="btn" id="btn-full" type="button">全画面</button>
  </header>
  <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  <main class="demo-main" id="demo-main"></main>
  <footer class="demo-bar">
    <button class="btn big" id="btn-prev" type="button">← 前の問題</button>
    <button class="btn big primary" id="btn-answer" type="button">答えを表示</button>
    <button class="btn big" id="btn-next" type="button">次の問題 →</button>
  </footer>
</div>

<script src="data/questions.js"></script>
<script>
(function () {
  "use strict";

  const $ = (s) => document.querySelector(s);

  const LEVEL_ORDER = ["N5", "N4", "N3", "N2", "N1"];
  const LEVEL_COLOR = { N5: "#2f9e6f", N4: "#2f8fe0", N3: "#d99a1b", N2: "#e8722f", N1: "#d6453b" };
  const CATS = ["文字词汇", "语法", "读解", "听解"];
  const CAT_LABEL = {"文字词汇":"文字・語彙","语法":"文法","读解":"読解","听解":"聴解"};

  let QUESTIONS = [];
  // 最初はレベル・分野・回を何も選択しない。先生が選んでから開始
  // 音频地址前缀：默认空（同目录 audio/ 相对路径）。
  // 部署到对象存储（如 Cloudflare R2）时改为存储域名，例如 "https://xxx.r2.dev/"，
  // 或运行时在地址栏加 ?audio_base= 覆盖，无需改代码。
  // 音频托管：Cloudflare Pages（免费对象托管）。可用 ?audio_base= 临时覆盖回本地或其他地址。
  const AUDIO_BASE = (window.AUDIO_BASE || "https://jlpt-audio-6vc.pages.dev/") + (location.search.match(/[?&]audio_base=([^&]+)/) ? decodeURIComponent(location.search.match(/[?&]audio_base=([^&]+)/)[1]) : "");
  const F = { levels: new Set(), categories: new Set(), yearMonths: new Set() };
  let LIST = [];
  let IDX = 0;
  let SHOW_ANS = false;
  let CLICKED = null;

  /* ---------- 工具 ---------- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // 渲染富文本：保留真题的 <u> 下划线标记，其余转义防 XSS
  function rich(s) {
    if (!s) return "";
    let t = String(s).replace(/<u>/gi, "\x00U\x00").replace(/<\/u>/gi, "\x00/U\x00");
    t = esc(t).replace(/\x00U\x00/g, "<u>").replace(/\x00\/U\x00/g, "</u>");
    return t.replace(/\n/g, "<br>");
  }

  function normalize(q) {
    return {
      id: String(q.id != null ? q.id : ""),
      level: String(q.level || "N?"),
      category: String(q.category || "未分類"),
      type: String(q.type || ""),
      question: String(q.question || ""),
      questionNumber: (q.questionNumber != null && !isNaN(q.questionNumber)) ? Number(q.questionNumber) : null,
      problemNumber: (q.problemNumber != null && !isNaN(q.problemNumber)) ? Number(q.problemNumber) : null,
      article: q.article || null,
      articleGroup: q.articleGroup || null,
      options: Array.isArray(q.options) ? q.options.map(String) : [],
      optionImages: Array.isArray(q.optionImages) ? q.optionImages.map((v) => (v || null)) : (Array.isArray(q.options) ? q.options.map(() => null) : []),
      answer: (typeof q.answer === "number") ? q.answer : (q.answer != null ? String(q.answer) : ""),
      explanation: String(q.explanation || ""),
      tags: Array.isArray(q.tags) ? q.tags.map(String) : [],
      source: String(q.source || "未記載"),
      audioUrl: q.audioUrl || null,
      imageUrl: q.imageUrl || null,
      year: q.year != null ? Number(q.year) : null
    };
  }

  function ymOf(q) {
    const m = (q.id || "").match(/^(\d{4})(\d{2})/);
    if (m) return { y: +m[1], m: +m[2] };
    return { y: q.year || null, m: null };
  }
  function ymKey(q) {
    const v = ymOf(q);
    if (v.y == null) return null;
    return v.m != null ? v.y + "-" + String(v.m).padStart(2, "0") : String(v.y);
  }
  function ymLabel(k) {
    if (!k) return "";
    const p = k.split("-");
    const mo = +p[1];
    return mo ? p[0] + "年" + mo + "月" : p[0] + "年";
  }

  function answerIndex(q) {
    const a = q.answer;
    if (typeof a === "number") return a;
    if (a == null || a === "") return -1;
    const n = parseInt(a, 10);
    return isNaN(n) ? -1 : n;
  }

  // 从解析中拆出【音声原文】（听力题），并进一步拆日语原文与中文翻译
  function splitTranscript(exp) {
    if (!exp) return null;
    const i = exp.indexOf("【音声原文】");
    if (i === -1) return null;
    const rest = exp.slice(i).replace(/^【音声原文】[:：]?/, "").trim();
    const j = rest.indexOf("【中文翻译】");
    let jp = rest, zh = "";
    if (j >= 0) {
      jp = rest.slice(0, j).trim();
      zh = rest.slice(j).replace(/^【中文翻译】[:：]?/, "").trim();
    }
    return { main: exp.slice(0, i).trim(), jp: jp, zh: zh };
  }
  // 清理中文翻译的列表格式 ['...', '...'] -> 每行一条
  function cleanZh(s) {
    if (!s) return "";
    const items = s.match(/'([^']*)'|"([^"]*)"/g);
    if (items) return items.map(function (it) { return it.replace(/^['"]|['"]$/g, ""); }).join("\n");
    return s.replace(/^[\[\]]+|[\[\]]+$/g, "").trim();
  }

  /* ---------- 数据加载（与主题库一致：优先服务器文件，其次内置真题） ---------- */
  async function loadData() {
    let got = false;
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 1500);
      const r = await fetch("/api/load", { signal: ctrl.signal });
      clearTimeout(timer);
      if (r.ok) {
        const arr = await r.json();
        if (Array.isArray(arr) && arr.length) { QUESTIONS = arr.map(normalize); got = true; }
      }
    } catch (e) { /* 直接 file:// 打开、无服务器时静默回退 */ }
    if (!got) {
      const emb = window.__QUESTIONS__ || [];
      QUESTIONS = (emb.length ? emb : (window.SEED_QUESTIONS || [])).map(normalize);
    }
  }

  /* ---------- 筛选 ---------- */
  function yearsForLevels(levelSet) {
    const yms = new Set();
    for (const q of QUESTIONS) {
      if (!levelSet.has(q.level)) continue;
      const k = ymKey(q);
      if (k) yms.add(k);
    }
    return Array.from(yms).sort();
  }

  function renderChips(el, values, set, group) {
    el.innerHTML = "";
    values.forEach((v) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip" + (set.has(v) ? " active" : "") + (group === "level" ? " lv-" + v.toLowerCase() : "");
      b.textContent = group === "year" ? ymLabel(v) : group === "category" ? (CAT_LABEL[v] || v) : v;
      b.onclick = () => {
        if (set.has(v)) set.delete(v); else set.add(v);
        if (group === "level") { F.yearMonths = new Set(); renderYearChips(); }
        renderChips(el, values, set, group);
        updateStat();
      };
      el.appendChild(b);
    });
  }

  function renderYearChips() {
    const el = $("#sel-year");
    const yms = yearsForLevels(F.levels);
    if (!yms.length) {
      el.innerHTML = '<span class="chip-hint">まずレベルを選択してください</span>';
      $("#toggle-year").disabled = true;
      return;
    }
    $("#toggle-year").disabled = false;
    renderChips(el, yms, F.yearMonths, "year");
  }

  function toggleAll(group) {
    const set = F[group];
    const all = group === "level" ? LEVEL_ORDER : group === "category" ? CATS : yearsForLevels(F.levels);
    const allSelected = all.length > 0 && all.every((v) => set.has(v));
    set.clear();
    if (!allSelected) all.forEach((v) => set.add(v));
    if (group === "level") { F.yearMonths = new Set(); renderYearChips(); renderChips($("#sel-level"), LEVEL_ORDER, F.levels, "level"); }
    else if (group === "category") renderChips($("#sel-category"), CATS, F.categories, "category");
    else renderYearChips();
    updateStat();
  }

  function matches(q) {
    if (F.levels.size && !F.levels.has(q.level)) return false;
    if (F.categories.size && !F.categories.has(q.category)) return false;
    if (F.yearMonths.size && !F.yearMonths.has(ymKey(q))) return false;
    return true;
  }

  function buildList() {
    LIST = QUESTIONS.filter(matches);
    LIST.sort((a, b) => a.id.localeCompare(b.id));
  }

  function updateStat() {
    const n = QUESTIONS.filter(matches).length;
    const el = $("#sel-stat");
    const startBtn = $("#btn-start"), randBtn = $("#btn-random");
    if (!F.levels.size && !F.categories.size && !F.yearMonths.size) {
      el.innerHTML = "まず<b>レベル</b>と<b>分野</b>を選んでからデモを開始してください";
      startBtn.disabled = true;
      randBtn.disabled = true;
      return;
    }
    if (!n) {
      el.innerHTML = "この条件では問題がありません。絞り込みを変えてみてください";
      startBtn.disabled = true;
      randBtn.disabled = true;
      return;
    }
    el.innerHTML = "合計 <b>" + n + "</b> 問 <small>（問題総数 " + QUESTIONS.length + " 問）</small>";
    startBtn.disabled = false;
    randBtn.disabled = false;
  }

  /* ---------- 演示 ---------- */
  function startDemo(rand) {
    buildList();
    if (!LIST.length) { updateStat(); return; }
    IDX = rand ? Math.floor(Math.random() * LIST.length) : 0;
    enterDemo();
  }

  function enterDemo() {
    SHOW_ANS = false;
    CLICKED = null;
    $("#view-select").hidden = true;
    $("#view-demo").hidden = false;
    renderDemo();
  }

  function backToSelect() {
    if (curAudio()) curAudio().pause();
    $("#view-demo").hidden = true;
    $("#view-select").hidden = false;
  }
  function curAudio() { return document.querySelector("#demo-main audio"); }

  function nav(delta) {
    if (!LIST.length) return;
    curAudio() && curAudio().pause();
    IDX = (IDX + delta + LIST.length) % LIST.length;
    SHOW_ANS = false;
    CLICKED = null;
    renderDemo();
  }

  function toggleAnswer() {
    SHOW_ANS = !SHOW_ANS;
    renderDemo();
    // 答えを表示したとき、解答エリアを画面内にスクロール（長文でも授業中の解説に便利）
    if (SHOW_ANS) {
      const box = document.querySelector("#demo-main .q-answer");
      if (box) box.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
  }

  function toggleArticle() {
    const box = document.querySelector("#demo-main .q-article");
    if (!box) return;
    box.classList.toggle("expanded");
    const btn = box.querySelector(".a-toggle");
    if (btn) btn.textContent = box.classList.contains("expanded") ? "閉じる" : "全文を表示";
  }

  function renderDemo() {
    const q = LIST[IDX];
    const ai = answerIndex(q);
    const ym = ymKey(q);
    const isListen = q.category === "听解";
    const listenWithImage = isListen && !!q.imageUrl;

    const head =
      '<div class="q-head">' +
        '<span class="badge lv" style="--lv:' + (LEVEL_COLOR[q.level] || "#0f7a40") + '">' + esc(q.level) + "</span>" +
        (q.problemNumber != null ? '<span class="badge prob">問題' + esc(q.problemNumber) + "</span>" : "") +
        '<span class="badge cat">' + esc(q.category) + "</span>" +
        '<span class="badge src">' + esc(q.source) + (ym ? " " + esc(ymLabel(ym)) : "") + "</span>" +
      "</div>";
    const typeHtml = q.type ? '<p class="q-type">' + rich(q.type) + "</p>" : "";

    // 音频：自定义播放器（进度条恒显示、可点击/拖动/触屏拖动）
    const audioHtml = q.audioUrl
      ? '<div class="q-audio">' +
          '<audio preload="metadata" src="' + esc(AUDIO_BASE + q.audioUrl) + '"></audio>' +
          '<div class="ap-bar">' +
            '<button class="ap-play" type="button">&#9654;</button>' +
            '<div class="ap-track"><div class="ap-fill"></div><div class="ap-thumb"></div></div>' +
            '<span class="ap-time">0:00 / 0:00</span>' +
          '</div>' +
        '</div>'
      : "";

    // 文章：读解大字号，限高滚动 + 全文を表示
    const articleHtml = q.article
      ? '<div class="q-article"><div class="a-head"><span class="a-label">文章</span><button class="a-toggle" type="button">全文を表示</button></div><div class="a-body">' + rich(q.article) + "</div></div>"
      : "";

    const stemHtml =
      '<div class="q-stem' + (isListen ? ' stem-listen' : '') + (q.category === "读解" ? ' stem-reading' : '') + '">' +
        (q.questionNumber != null ? '<span class="qn">問' + esc(q.questionNumber) + "</span>" : "") +
        rich(q.question) +
      "</div>";

    const optsHtml = q.options.length
      ? '<div class="q-opts' + (q.category === "文字词汇" || q.category === "语法" ? " opts-lg" : "") + '">' + q.options.map((o, i) => {
          const cls = ["opt"];
          if (SHOW_ANS && i === ai) cls.push("correct");
          if (SHOW_ANS && CLICKED === i && i !== ai) cls.push("wrong");
          const oi = q.optionImages && q.optionImages[i];
          const inner = oi
            ? '<img src="' + esc(oi) + '" alt="選択肢の画像" />'
            : '<span class="ot">' + rich(o) + "</span>";
          const ok = (SHOW_ANS && i === ai) ? '<span class="ok-badge">正解</span>' : "";
          return '<div class="' + cls.join(" ") + '" data-i="' + i + '">' +
            '<span class="on">' + (i + 1) + "</span>" + inner + ok + "</div>";
        }).join("") + "</div>"
      : "";

    let ansHtml = "";
    if (SHOW_ANS) {
      const ansText = ai >= 0 && q.options[ai]
        ? (ai + 1) + " " + q.options[ai]
        : (ai >= 0 ? String(ai + 1) : "答えが未入力");
      const sp = splitTranscript(q.explanation);
      const mainExp = sp ? sp.main : q.explanation;
      const transHtml = sp
        ? '<details class="ans-trans"><summary>聴解原文</summary>' +
            '<div class="tr-jp">' + rich(sp.jp) + "</div>" +
            (sp.zh ? '<div class="tr-zh">' + rich(cleanZh(sp.zh)) + "</div>" : "") +
          "</details>"
        : "";
      ansHtml =
        '<div class="q-answer">' +
          '<span class="ans-badge">正解：' + esc(ansText) + "</span>" +
          (mainExp ? '<div class="ans-exp">' + rich(mainExp) + "</div>" : "") +
          transHtml +
        "</div>";
    }

    let inner;
    if (listenWithImage) {
      // 听解带图：左栏大图，右栏音频 + 题干 + 选项，保证同屏
      const imageHtml = '<div class="q-image"><img src="' + esc(q.imageUrl) + '" alt="問題の画像" /></div>';
      inner =
        '<div class="q-listen">' +
          imageHtml +
          '<div class="q-listen-right">' + audioHtml + stemHtml + optsHtml + "</div>" +
        "</div>";
    } else {
      const imageHtml = q.imageUrl
        ? '<div class="q-image"><img src="' + esc(q.imageUrl) + '" alt="問題の画像" /></div>'
        : "";
      inner = audioHtml + imageHtml + articleHtml + stemHtml + optsHtml;
    }
    inner += ansHtml;

    $("#demo-main").innerHTML = '<div class="demo-inner">' + head + typeHtml + inner + "</div>";

    // 选项点击判对错
    $("#demo-main").querySelectorAll(".opt").forEach((el) => {
      el.onclick = () => {
        if (!SHOW_ANS) { CLICKED = +el.getAttribute("data-i"); toggleAnswer(); }
      };
    });
    // 文章展开 / 收起
    $("#demo-main").querySelectorAll(".a-toggle").forEach((el) => {
      el.onclick = toggleArticle;
    });

    // 初始化自定义播放器（进度条可点按/拖动）
    var audioBox = document.querySelector("#demo-main .q-audio");
    if (audioBox) initPlayer(audioBox);

    $("#demo-meta").textContent = q.level + " · " + (CAT_LABEL[q.category] || q.category) + (ym ? " · " + ymLabel(ym) + "本試験" : "");
    $("#demo-progress").textContent = "第 " + (IDX + 1) + " / " + LIST.length + " 問";
    $("#progress-fill").style.width = ((IDX + 1) / LIST.length * 100) + "%";
    $("#btn-answer").textContent = SHOW_ANS ? "答えを隠す" : "答えを表示";
    $("#demo-main").scrollTop = 0;
  }


  /* ---------- 自定义音频播放器（加固版：PointerEvents 拖动 + 轮询更新，跨设备） ---------- */
  function initPlayer(box) {
    var audio = box.querySelector("audio");
    if (!audio) return;
    var play = box.querySelector(".ap-play");
    var track = box.querySelector(".ap-track");
    var fill = box.querySelector(".ap-fill");
    var thumb = box.querySelector(".ap-thumb");
    var time = box.querySelector(".ap-time");
    var dragging = false;

    function fmt(t) {
      if (!isFinite(t) || t < 0) return "0:00";
      var m = Math.floor(t / 60), s = Math.floor(t % 60);
      return m + ":" + (s < 10 ? "0" : "") + s;
    }
    function dur() {
      var d = audio.duration;
      return (isFinite(d) && d > 0) ? d : 0;
    }
    function pct() {
      var d = dur();
      return d ? Math.min(100, Math.max(0, audio.currentTime / d * 100)) : 0;
    }
    function updateUI() {
      if (!box.isConnected) { clearInterval(timer); return; }
      var p = pct();
      fill.style.width = p + "%";
      thumb.style.left = p + "%";
      time.textContent = fmt(audio.currentTime) + " / " + (dur() ? fmt(dur()) : "--:--");
      play.textContent = audio.paused ? "▶" : "❚❚";
    }
    function seekFrom(clientX) {
      var d = dur();
      if (!d) return;
      var r = track.getBoundingClientRect();
      if (!r.width) return;
      var p = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
      try { audio.currentTime = p * d; } catch (e) {}
      updateUI();
    }

    audio.addEventListener("loadedmetadata", updateUI);
    audio.addEventListener("durationchange", updateUI);
    audio.addEventListener("timeupdate", updateUI);
    audio.addEventListener("play", updateUI);
    audio.addEventListener("pause", updateUI);
    audio.addEventListener("ended", updateUI);
    audio.addEventListener("error", function () {
      if (!box.querySelector(".ap-err")) {
        var err = document.createElement("span");
        err.className = "ap-err";
        err.textContent = "音声の読み込みに失敗しました";
        box.querySelector(".ap-bar").appendChild(err);
      }
    });

    // 轮询兜底：即使 timeupdate 不触发，进度条也随播放移动
    var timer = setInterval(updateUI, 200);

    // 播放 / 暂停
    play.addEventListener("click", function () {
      if (audio.paused) {
        var pr = audio.play();
        if (pr && pr.catch) pr.catch(function () {});
      } else {
        audio.pause();
      }
      play.blur();
    });

    // 拖动 / 点按进度条：Pointer Events（鼠标 + 触屏 + 触控笔统一）
    track.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      dragging = true;
      try { track.setPointerCapture(e.pointerId); } catch (e2) {}
      seekFrom(e.clientX);
    });
    track.addEventListener("pointermove", function (e) {
      if (dragging) seekFrom(e.clientX);
    });
    track.addEventListener("pointerup", function () {
      dragging = false;
    });
    track.addEventListener("pointercancel", function () {
      dragging = false;
    });
    // 键盘可操作（无障碍/遥控器）：轨道获得焦点后用方向键
    track.tabIndex = 0;
    track.addEventListener("keydown", function (e) {
      var d = dur();
      if (!d) return;
      if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
        e.preventDefault();
        var step = (e.key === "ArrowLeft" ? -1 : 1) * Math.max(3, d / 50);
        audio.currentTime = Math.min(d, Math.max(0, audio.currentTime + step));
        updateUI();
      }
    });

    updateUI();
  }

  /* ---------- 全画面 ---------- */
  function toggleFullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  }
  document.addEventListener("fullscreenchange", () => {
    $("#btn-full").textContent = document.fullscreenElement ? "退出全画面" : "全画面";
  });

  /* ---------- 键盘 ---------- */
  document.addEventListener("keydown", (e) => {
    if ($("#view-demo").hidden) return;
    const tag = (document.activeElement && document.activeElement.tagName) || "";
    if (/INPUT|TEXTAREA|SELECT/.test(tag)) return;
    if (e.key === "ArrowLeft") { e.preventDefault(); nav(-1); }
    else if (e.key === "ArrowRight") { e.preventDefault(); nav(1); }
    else if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggleAnswer(); }
    else if (e.key === "f" || e.key === "F") toggleFullscreen();
  });

  /* ---------- 事件 ---------- */
  $("#btn-start").addEventListener("click", () => startDemo(false));
  $("#btn-random").addEventListener("click", () => startDemo(true));
  $("#btn-back").addEventListener("click", backToSelect);
  $("#btn-prev").addEventListener("click", () => nav(-1));
  $("#btn-next").addEventListener("click", () => nav(1));
  $("#btn-answer").addEventListener("click", toggleAnswer);
  $("#btn-full").addEventListener("click", toggleFullscreen);
  $("#toggle-level").addEventListener("click", () => toggleAll("level"));
  $("#toggle-category").addEventListener("click", () => toggleAll("category"));
  $("#toggle-year").addEventListener("click", () => toggleAll("yearMonth"));

  /* ---------- 启动 ---------- */
  (async function init() {
    await loadData();
    renderChips($("#sel-level"), LEVEL_ORDER, F.levels, "level");
    renderChips($("#sel-category"), CATS, F.categories, "category");
    renderYearChips();
    updateStat();
    // 支持 classroom.html#demo 直达演示（便于收藏 / 上课一键进入）
    if (location.hash === "#demo") startDemo(false);
  })();
})();
</script>
</body>
</html>
