<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漢字たまご 練習</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Meiryo","メイリオ","Noto Sans JP",system-ui,sans-serif;color:#1f2937}
body{min-height:100vh;background:#f8faf9;padding:40px 24px}
.wrap{max-width:1100px;margin:0 auto;background:#fff;padding:36px 32px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.08);border:1px solid #e5e7eb}
h1{font-size:1.5rem;font-weight:700;text-align:center;margin-bottom:22px;letter-spacing:2px}

/* ===== コントロールエリア ===== */
.ctrl-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center;margin-bottom:12px}
.ctrl-label{font-size:14px;font-weight:700;color:#0f7a40;margin-right:2px}
select{padding:8px 14px;font-size:15px;border-radius:10px;border:1px solid #d1d5db;background:#fff;color:#374151;cursor:pointer;outline:none}
select:focus{border-color:#0f7a40;box-shadow:0 0 0 3px rgba(15,122,64,.15)}
select:disabled{opacity:.5;cursor:not-allowed}

/* ===== 表示倍率（ページ全体を等倍で拡大） ===== */
:root{--page-zoom:1}
.zoom-root{zoom:var(--page-zoom)}
.stepper{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid #e5e7eb;border-radius:999px;padding:2px 4px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.stepper-btn{flex:0 0 auto;width:26px;height:26px;border:none;border-radius:50%;background:#f0eff6;color:#5a5a63;font-size:16px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .12s cubic-bezier(.34,1.4,.6,1),opacity .12s}
.stepper-btn:hover:not(:disabled){transform:scale(1.05)}
.stepper-btn:active:not(:disabled){transform:scale(.92)}
.stepper-btn:disabled{opacity:.4;cursor:not-allowed}
.stepper-value{position:relative;min-width:48px;height:26px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.stepper-value .digit{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#242426;font-variant-numeric:tabular-nums;transition:transform .18s cubic-bezier(.34,1.35,.6,1),opacity .18s}
.stepper-value .digit.pop{transform:scale(1.18);opacity:.55}

/* ===== ページ Combobox（watermelon combobox-11 の複数選択スタイルを再現）===== */
.page-field{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:4px}
.cb-label{font-size:14px;font-weight:700;color:#0f7a40}

/* トリガー：選択済みバッジ + 展開矢印 */
.cb-trigger{
  display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
  width:min(560px,100%);min-height:46px;padding:8px 12px;
  background:#fff;border:1px solid #e5e7eb;border-radius:16px;
  font-size:14px;color:#1f2937;cursor:pointer;text-align:left;
  box-shadow:0 1px 2px rgba(0,0,0,.05);
  transition:background .16s ease,border-color .16s ease,box-shadow .16s ease}
.cb-trigger:hover:not(:disabled){background:#f8fafc}
.cb-trigger:focus-visible{outline:none;border-color:#0ea5e9;box-shadow:0 0 0 3px rgba(14,165,233,.22)}
.cb-trigger:disabled{opacity:.5;cursor:not-allowed}
.cb-trigger .cb-badges{display:flex;flex-wrap:wrap;align-items:center;gap:6px;flex:1;min-width:0}
.cb-placeholder{color:#9ca3af;margin-top:3px}
.cb-caret{flex:0 0 auto;margin-top:4px;color:#9ca3af;font-size:11px;line-height:1}

/* バッジ */
.badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 6px 5px 10px;border-radius:8px;
  border:1px solid #e5e7eb;background:rgba(240,253,244,.7);
  font-size:13px;font-weight:600;color:#0f7a40;line-height:1.3}
.badge-x{
  display:inline-flex;align-items:center;justify-content:center;
  width:16px;height:16px;border:none;border-radius:4px;
  background:transparent;color:#9ca3af;cursor:pointer;font-size:11px;line-height:1;padding:0}
.badge-x:hover{background:rgba(15,122,64,.16);color:#0f7a40}
.badge-more{border-style:dashed;background:transparent;color:#6b7280;cursor:pointer;padding:5px 10px}
.badge-more:hover{background:#f8fafc;color:#374151}

/* ドロップダウン */
.cb-panel{
  display:none;width:min(560px,100%);margin-top:6px;
  background:#fff;border:1px solid #e5e7eb;border-radius:16px;
  box-shadow:0 12px 32px rgba(15,23,42,.14);overflow:hidden}
.cb-panel.open{display:block}
.cb-search{
  width:100%;border:none;border-bottom:1px solid #eef2f7;outline:none;
  padding:11px 14px;font-size:14px;font-family:inherit;background:#fff;color:#1f2937}
.cb-search::placeholder{color:#9ca3af}
.cb-list{max-height:240px;overflow-y:auto;padding:6px}
.cb-opt{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:8px 10px;border:none;border-radius:8px;background:transparent;
  font-size:14px;color:#374151;cursor:pointer;text-align:left;font-family:inherit}
.cb-opt:hover{background:#f1f5f9}
.cb-opt .cb-check{width:16px;flex:0 0 auto;color:#0ea5e9;font-weight:700;font-size:13px}
.cb-opt .cb-pg{font-variant-numeric:tabular-nums;font-weight:700;color:#0f7a40;min-width:30px}
.cb-opt .cb-count{margin-left:auto;font-size:12px;color:#9ca3af}
.cb-empty{padding:16px;text-align:center;font-size:13px;color:#9ca3af}

/* ===== ボタン（watermelon button-10 のスライドグラデーションを再現）===== */
.btn{padding:10px 22px;font-size:14px;border:none;border-radius:12px;cursor:pointer;font-weight:600;letter-spacing:.5px;color:#fff;
  background:linear-gradient(90deg,#0284c7 0%,#0ea5e9 50%,#0284c7 100%);
  background-size:200% auto;background-position:0% center;
  transition:transform .15s,box-shadow .15s,opacity .15s,background-position .5s ease-out}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 16px rgba(2,132,199,.28);background-position:100% center}
.btn:active:not(:disabled){transform:translateY(0)}
.btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.btn-ghost{background:#fff;color:#4b5563;border:1px solid #d1d5db}
.btn-ghost:hover:not(:disabled){background:#f9fafb;box-shadow:0 4px 12px rgba(0,0,0,.08)}

/* ===== メッセージ ===== */
.pages-info{font-size:13px;color:#6b7280;text-align:center;min-height:18px;margin-top:6px}
.pages-info.warn{color:#dc2626}
.game-state{text-align:center;font-size:13px;color:#0f7a40;margin-top:10px;min-height:18px;font-weight:600}

/* ===== カード ===== */
.cards{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:20px;min-height:420px;position:relative}
.flip-card{width:150px;height:190px;perspective:1000px;cursor:pointer;position:relative;
  transition:transform .3s cubic-bezier(.2,1.3,.3,1),box-shadow .3s}
.flip-card:hover{transform:translateY(-6px) scale(1.03);box-shadow:0 16px 40px rgba(15,122,64,.20)}
.flip-card-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.flip-card.flipped .flip-card-inner{transform:rotateY(180deg)}
.flip-card-front,.flip-card-back{position:absolute;inset:0;border-radius:18px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;text-align:center;
  overflow:hidden;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.flip-card-front{background:linear-gradient(160deg,#ffffff 0%,#f0fdf4 100%);border:1px solid #d1fae5;box-shadow:0 8px 24px rgba(15,122,64,.12)}
.flip-card-back{background:linear-gradient(160deg,#0f7a40 0%,#0a5c2f 100%);border:1px solid #0a5c2f;
  transform:rotateY(180deg);box-shadow:0 12px 32px rgba(15,122,64,.30)}

/* 表面の語句：文字数ごとに固定の文字サイズを静的指定（純 CSS、JS での動的調整は行わない） */
.card-kanji{font-weight:700;color:#0f7a40;line-height:1.25;word-break:keep-all}
.len-1,.len-2{font-size:2.6rem}
.len-3{font-size:2.1rem}
.len-4{font-size:1.7rem}
.len-5{font-size:1.35rem}
.len-6{font-size:1.15rem}

/* 裏面の番号 */
.card-num{font-size:1.6rem;font-weight:800;color:#fff;line-height:1;letter-spacing:.04em}
.card-page{margin-top:8px;font-size:.8rem;color:rgba(255,255,255,.8);letter-spacing:.06em}

/* 反転時の透け問題 修正 */
.flip-card-front > *,.flip-card-back > *{-webkit-backface-visibility:hidden;backface-visibility:hidden}

.game-animating .flip-card{pointer-events:none}
.game-animating .flip-card-inner{transition:none!important}
.empty-msg{font-size:18px;color:#dc2626;margin-top:60px;text-align:center}
.empty-hint{color:#6b7280;font-size:14px;margin-top:8px;text-align:center;line-height:1.7}

.back-btn{position:fixed;top:16px;left:20px;z-index:999;padding:8px 16px;background:rgba(255,255,255,.85);backdrop-filter:blur(4px);color:#0f7a40;font-size:14px;font-weight:600;border-radius:10px;border:1px solid #e5e7eb;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.08);transition:transform .15s,box-shadow .15s}
.back-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.12)}

/* 背景：トップの草の丘画像（低透明度 + ガウスぼかし） */
.page-bg{position:fixed;inset:0;z-index:0;background:#f8faf9 url('assets/hero-34-bg.jpg') center/cover no-repeat;opacity:.16;filter:blur(12px);transform:scale(1.06);pointer-events:none;}
body>*:not(.page-bg):not(.back-btn){position:relative;z-index:1}

@media (max-width:640px){
  body{padding:20px 12px}
  .wrap{padding:24px 16px}
  .chip{padding:5px 10px;font-size:13px}
  .btn{padding:9px 16px;font-size:13px}
  .flip-card{width:130px;height:170px}
  .len-1,.len-2{font-size:2.2rem} .len-3{font-size:1.8rem} .len-4{font-size:1.5rem}
}
</style>
</head>
<body>
<div class="page-bg" aria-hidden="true"></div>
<a class="back-btn" href="./index.html">← ホーム</a>

<div class="zoom-root" id="zoomRoot">
<div class="wrap">
  <h1>漢字たまご 練習</h1>

  <div class="ctrl-row">
    <span class="ctrl-label">教材</span>
    <select id="sel-level">
      <option value="初級">漢字たまご 初級</option>
      <option value="初中級">漢字たまご 初中級</option>
    </select>
    <span class="ctrl-label">表示倍率</span>
    <div class="stepper" id="zoomStepper">
      <button type="button" class="stepper-btn" id="zoomMinus" aria-label="縮小">−</button>
      <div class="stepper-value" id="zoomValue"><span class="digit">130%</span></div>
      <button type="button" class="stepper-btn" id="zoomPlus" aria-label="拡大">+</button>
    </div>
  </div>

  <div class="page-field">
    <span class="cb-label">ページ</span>
    <button type="button" class="cb-trigger" id="cb-trigger" aria-haspopup="listbox" aria-expanded="false">
      <span class="cb-badges" id="cb-badges"></span>
      <span class="cb-caret" aria-hidden="true">▼</span>
    </button>
    <div class="cb-panel" id="cb-panel">
      <input type="text" class="cb-search" id="cb-search" placeholder="ページ番号で検索（例：10）" autocomplete="off">
      <div class="cb-list" id="cb-list" role="listbox"></div>
    </div>
  </div>

  <div class="pages-info" id="pages-info"></div>

  <div class="ctrl-row" style="margin-top:14px">
    <button class="btn" id="btn-start" onclick="startGame()" disabled>開始ゲーム</button>
    <button class="btn" id="btn-reshuffle" onclick="reshuffle()" disabled>再生成</button>
    <button class="btn btn-ghost" id="btn-clear" onclick="resetAll()">クリア</button>
  </div>

  <div class="game-state" id="game-state"></div>
  <div class="cards" id="cards"></div>
</div>
</div>

let gameActive   = false;   // カードをクリックできる状態
let gameAnimating = false;  // 洗牌动画进行中
let gameToken    = 0;       // 令牌：使旧的 setTimeout 链失效
let selectedPages = new Set();
let currentCards  = [];     // 当前显示的词条数组
const BOX_PAD = 14;

const elCards  = document.getElementById('cards');
const elInfo   = document.getElementById('pages-info');
const elState  = document.getElementById('game-state');
const btnStart = document.getElementById('btn-start');
const btnResh  = document.getElementById('btn-reshuffle');
const btnClear = document.getElementById('btn-clear');
const selLevel = document.getElementById('sel-level');
const cbTrigger= document.getElementById('cb-trigger');
const elBadges = document.getElementById('cb-badges');
const elPanel  = document.getElementById('cb-panel');
const elSearch = document.getElementById('cb-search');
const elList   = document.getElementById('cb-list');

// ======== 表示倍率（ページ全体を等倍で拡大） ========
// CSS の zoom を使い、ページ全体をそのまま拡大する。
// zoom 下では getBoundingClientRect() が拡大後の px を返し、
// transform の translate() 値も拡大後になるため、
// JS 側の座標計算では必ず 1/zoom を掛けること。
const ZOOM_KEY   = 'jp-practice-zoom';
const ZOOM_MIN   = 1;
const ZOOM_MAX   = 2;
const ZOOM_STEP  = 0.1;
const zoomValue  = document.getElementById('zoomValue');
const zoomMinus  = document.getElementById('zoomMinus');
const zoomPlus   = document.getElementById('zoomPlus');
let zoomLevel    = ZOOM_MIN;

// 保存済みの倍率を優先。無ければ投影用途を想定した初期値（狭い画面では等倍）
(function initZoom(){
  let v = null;
  try{ v = parseFloat(localStorage.getItem(ZOOM_KEY)); }catch(e){}
  if(!isNaN(v) && v >= ZOOM_MIN && v <= ZOOM_MAX){
    zoomLevel = v;
  } else {
    zoomLevel = (window.innerWidth >= 900) ? 1.3 : ZOOM_MIN;
  }
})();

function applyZoom(){
  document.documentElement.style.setProperty('--page-zoom', String(zoomLevel));
  const digit = zoomValue.querySelector('.digit');
  if(digit){
    digit.textContent = Math.round(zoomLevel * 100) + '%';
    digit.classList.add('pop');
    setTimeout(function(){ digit.classList.remove('pop'); }, 140);
  }
  zoomMinus.disabled = zoomLevel <= ZOOM_MIN;
  zoomPlus.disabled  = zoomLevel >= ZOOM_MAX;
}
function setZoom(v){
  zoomLevel = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, Math.round(v * 10) / 10));
  try{ localStorage.setItem(ZOOM_KEY, String(zoomLevel)); }catch(e){}
  applyZoom();
}
zoomMinus.onclick = function(){ setZoom(zoomLevel - ZOOM_STEP); };
zoomPlus.onclick  = function(){ setZoom(zoomLevel + ZOOM_STEP); };
applyZoom();

// 現在の拡大率。座標計算の補正に使う
function zoomFactor(){
  return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--page-zoom')) || 1;
}

/* ===== ページ Combobox（複数選択 + 検索 + バッジ）===== */
const MAX_SHOWN = 2;                    // 收起时最多显示 2 个徽标
let comboOpen = false;
let comboExpanded = false;

function pagesOf(level){
  return Object.keys(KANJI_TAMAGO[level] || {}).map(Number).sort((a,b)=>a-b);
}
function wordCount(level, p){
  return ((KANJI_TAMAGO[level] || {})[p] || []).length;
}

// トリガーのバッジ
function renderBadges(){
  const sel = [...selectedPages].sort((a,b)=>a-b);
  elBadges.innerHTML = '';
  if(!sel.length){
    elBadges.innerHTML = '<span class="cb-placeholder">ページを選択してください</span>';
    return;
  }
  const shown = comboExpanded ? sel : sel.slice(0, MAX_SHOWN);
  shown.forEach(function(p){
    const b = document.createElement('span');
    b.className = 'badge';
    b.innerHTML = p;
    const x = document.createElement('button');
    x.type = 'button';
    x.className = 'badge-x';
    x.textContent = '✕';
    x.title = 'このページを削除';
    x.addEventListener('click', function(ev){
      ev.stopPropagation();
      selectedPages.delete(p);
      generate();
    });
    b.appendChild(x);
    elBadges.appendChild(b);
  });
  const hidden = sel.length - shown.length;
  if(hidden > 0 || comboExpanded){
    const more = document.createElement('span');
    more.className = 'badge badge-more';
    more.textContent = comboExpanded ? '表示を減らす' : ('+' + hidden + ' ページ');
    more.addEventListener('click', function(ev){
      ev.stopPropagation();
      comboExpanded = !comboExpanded;
      renderBadges();
    });
    elBadges.appendChild(more);
  }
}

// ドロップダウン一覧（検索フィルタ対応）
function renderOptions(){
  const level = selLevel.value;
  const q = elSearch.value.trim();
  elList.innerHTML = '';
  let pages = pagesOf(level);
  if(q) pages = pages.filter(p => String(p).includes(q));
  if(!pages.length){
    elList.innerHTML = '<div class="cb-empty">該当するページがありません</div>';
    return;
  }
  pages.forEach(function(p){
    const row = document.createElement('button');
    row.type = 'button';
    row.className = 'cb-opt';
    row.setAttribute('role', 'option');
    const on = selectedPages.has(p);
    row.setAttribute('aria-selected', on ? 'true' : 'false');
    row.innerHTML =
      '<span class="cb-check">' + (on ? '✓' : '') + '</span>' +
      '<span class="cb-pg">' + p + '</span>' +
      '<span>ページ</span>' +
      '<span class="cb-count">' + wordCount(level, p) + ' 語</span>';
    row.addEventListener('click', function(){
      if(gameAnimating) return;
      if(selectedPages.has(p)) selectedPages.delete(p); else selectedPages.add(p);
      generate();
    });
    elList.appendChild(row);
  });
}

function openCombo(){
  if(gameAnimating) return;
  comboOpen = true;
  elPanel.classList.add('open');
  cbTrigger.setAttribute('aria-expanded', 'true');
  renderOptions();
  elSearch.focus();
}
function closeCombo(){
  comboOpen = false;
  elPanel.classList.remove('open');
  cbTrigger.setAttribute('aria-expanded', 'false');
  comboExpanded = false;
  elSearch.value = '';
}
function toggleCombo(){ comboOpen ? closeCombo() : openCombo(); }

cbTrigger.addEventListener('click', toggleCombo);
elSearch.addEventListener('input', renderOptions);
document.addEventListener('click', function(e){
  if(!comboOpen) return;
  if(!elPanel.contains(e.target) && e.target !== cbTrigger && !cbTrigger.contains(e.target)) closeCombo();
});
// キーボード：Esc で閉じる、Enter で確定
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && comboOpen){ e.stopPropagation(); closeCombo(); }
  if(e.key === 'Enter' && comboOpen){ e.preventDefault(); closeCombo(); }
});

/* ===== カード生成 ===== */
function generate(){
  gameToken++;                       // 使进行中的动画失效
  gameAnimating = false;
  gameActive = false;
  elCards.classList.remove('game-animating');
  renderBadges();                    // 徽标与选择同步
  if(comboOpen) renderOptions();     // パネルを開いている間はチェック状態も同期

  const level = selLevel.value;
  const data  = KANJI_TAMAGO[level] || {};
  const picked = [...selectedPages].sort((a,b)=>a-b);
  const allPages = pagesOf(level);

  if(!picked.length){
    currentCards = [];
    elCards.innerHTML = '<div class="empty-msg">ページを選んでください</div>'
      + '<div class="empty-hint">' + level + ' の収録ページ：'
      + allPages.map(p=>'<b>'+p+'</b>').join('・') + '</div>';
    elInfo.textContent = '';
    elState.textContent = '';
    btnStart.disabled = true; btnResh.disabled = true;
    lockControls(false);
    return;
  }

  // 収集 + ページをまたぐ重複除去
  const seen = new Set();
  const cards = [];
  const dupes = [];
  picked.forEach(function(p){
    (data[p] || []).forEach(function(w){
      if(seen.has(w)){ dupes.push(w); return; }
      seen.add(w);
      cards.push({ word:w, page:p });
    });
  });
  currentCards = cards;

  let info = picked.join('・') + ' ページ　' + cards.length + ' 枚';
  if(dupes.length) info += '（重複 ' + dupes.length + ' 語を除外：' + dupes.join('、') + '）';
  elInfo.textContent = info;
  elInfo.classList.toggle('warn', dupes.length > 0);

  renderCardList();
  btnStart.disabled = false;
  btnResh.disabled  = false;
  lockControls(false);
  elState.textContent = cards.length + ' 枚のカードを準備しました';
}

// カードを描画（アニメーションは動かさない）
function renderCardList(){
  elCards.innerHTML = '';
  currentCards.forEach(function(c, i){
    const card = document.createElement('div');
    card.className = 'flip-card';
    const len = [...c.word].length;
    const cls = len >= 6 ? 'len-6' : 'len-' + len;
    card.innerHTML =
      '<div class="flip-card-inner">' +
        '<div class="flip-card-front"><div class="card-kanji ' + cls + '">' + c.word + '</div></div>' +
        '<div class="flip-card-back">' +
          '<div class="card-num">#' + (i+1) + '</div>' +
          '<div class="card-page">p.' + c.page + '</div>' +
        '</div>' +
      '</div>';
    card.addEventListener('click', function(){
      if(gameAnimating || !gameActive) return;
      card.classList.toggle('flipped');
    });
    elCards.appendChild(card);
  });
}

/* ===== シャッフルゲーム ===== */
function startGame(){
  if(!currentCards.length || gameAnimating) return;
  const myToken = ++gameToken;
  const alive = ()=> myToken === gameToken;   // 令牌校验

  const cards = Array.from(elCards.querySelectorAll('.flip-card'));
  if(!cards.length) return;

  gameAnimating = true;
  gameActive    = false;
  elCards.classList.add('game-animating');
  btnStart.disabled = true;
  btnResh.disabled  = true;
  lockControls(true);
  elState.textContent = 'カードをシャッフル中...';

  // フェーズ 1：裏返す
  cards.forEach(function(c){ c.classList.add('flipped'); });
  const t1 = 420;

  // フェーズ 2：中央に重ねる
  setTimeout(function(){
    if(!alive()) return;
    const zf = zoomFactor();
    const boxRect = elCards.getBoundingClientRect();
    const cx = boxRect.left + boxRect.width / 2;
    const cy = boxRect.top  + boxRect.height / 2;
    cards.forEach(function(c, i){
      const r = c.getBoundingClientRect();
      // rect は拡大後の px、translate は拡大前の px なので 1/zoom で補正する
      const sx = (cx - r.left) / zf - BOX_PAD * i;
      const sy = (cy - r.top)  / zf - BOX_PAD * i;
      const sr = (Math.random() * 6 - 3).toFixed(2);
      c.style.transition = 'transform 450ms cubic-bezier(.55,.05,.3,.95)';
      c.style.transform = 'translate(' + sx + 'px,' + sy + 'px) rotate(' + sr + 'deg)';
      c.style.zIndex = i;
    });
  }, t1);
  const t2 = t1 + 470;

  // フェーズ 3：シャッフル振動（4 往復）
  setTimeout(function(){
    if(!alive()) return;
    let round = 0;
    (function jitter(){
      if(!alive()) return;
      if(round >= 4){
        cards.forEach(function(c){ c.style.zIndex = Math.floor(Math.random() * cards.length); });
        return;
      }
      round++;
      cards.forEach(function(c){
        const dx = (Math.random()*32-16).toFixed(1);
        const dy = (Math.random()*24-12).toFixed(1);
        const rr = (Math.random()*24-12).toFixed(2);
        c.style.transition = 'transform 100ms cubic-bezier(.25,.8,.25,1)';
        c.style.transform = 'translate(' + dx + 'px,' + dy + 'px) rotate(' + rr + 'deg)';
      });
      setTimeout(jitter, 110);
    })();
  }, t2);
  const t3 = t2 + 480;

  // フェーズ 4：DOM 並べ替え + 番号振り直し（中央の位置を保持）
  setTimeout(function(){
    if(!alive()) return;
    cards.forEach(function(c){ c.style.transition = 'none'; });
    const shuffled = cards.slice();
    for(let i = shuffled.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    shuffled.forEach(function(c){ elCards.appendChild(c); });

    void elCards.offsetHeight;                       // 强制重排
    const zf = zoomFactor();
    const newCards = Array.from(elCards.querySelectorAll('.flip-card'));
    const targetRects = newCards.map(function(c){ return c.getBoundingClientRect(); });
    const currentRects = newCards.map(function(c){ return c.getBoundingClientRect(); });
    newCards.forEach(function(c, i){
      // rect は拡大後の px なので 1/zoom で補正する
      const dx = (currentRects[i].left - targetRects[i].left) / zf;
      const dy = (currentRects[i].top  - targetRects[i].top ) / zf;
      c.style.transform = 'translate(' + dx + 'px,' + dy + 'px) rotate(0deg)';
      c.style.zIndex = '';
      c.querySelector('.card-num').textContent = '#' + (i + 1);
    });

    // フェーズ 5：1 枚ずつ配る
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        if(!alive()) return;
        newCards.forEach(function(c, i){
          setTimeout(function(){
            if(!alive()) return;
            c.style.transition = 'transform 400ms cubic-bezier(.2,.8,.2,1)';
            c.style.transform = '';
          }, i * 55);
        });
        setTimeout(function(){
          if(!alive()) return;
          newCards.forEach(function(c){ c.style.transition=''; c.style.transform=''; });
          elCards.classList.remove('game-animating');
          gameAnimating = false;
          gameActive    = true;
          btnStart.disabled = false;
          btnResh.disabled  = false;
          lockControls(false);
          elState.textContent = 'ゲーム開始！ カードをタップして裏を確認';
        }, newCards.length * 55 + 450);
      });
    });
  }, t3);
}

// 再シャッフル：ページの選択は保持し、カードだけ並べ替える
function reshuffle(){
  if(!currentCards.length) return;
  generate();
  startGame();
}

// ゲーム中は操作を無効化し、状態機械の破綻を防ぐ
function lockControls(on){
  selLevel.disabled = on;
  cbTrigger.disabled = on;
  btnClear.disabled = on;
  if(on && comboOpen) closeCombo();   // 动画期间收起面板
}

// クリア：ページの選択とカードを消す
function resetAll(){
  gameToken++;
  gameAnimating = false;
  gameActive = false;
  elCards.classList.remove('game-animating');
  selectedPages.clear();
  currentCards = [];
  closeCombo();
  renderBadges();
  elCards.innerHTML = '';
  elInfo.textContent = '';
  elInfo.classList.remove('warn');
  elState.textContent = '';
  btnStart.disabled = true;
  btnResh.disabled  = true;
  selLevel.disabled = false;
  cbTrigger.disabled = false;
}

// ショートカット：Space 開始 / R 再シャッフル / C クリア
document.addEventListener('keydown', function(e){
  if(e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  if(e.code === 'Space'){ e.preventDefault(); if(!btnStart.disabled) startGame(); }
  else if(e.key === 'r' || e.key === 'R'){ if(!btnResh.disabled) reshuffle(); }
  else if(e.key === 'c' || e.key === 'C'){ resetAll(); }
});

// 教材切替：存在しないページを除外し、バッジと一覧を再構築
selLevel.addEventListener('change', function(){
  gameToken++;
  gameAnimating = false;
  gameActive = false;
  elCards.classList.remove('game-animating');
  currentCards = [];
  const pages = pagesOf(selLevel.value);
  selectedPages = new Set([...selectedPages].filter(p=>pages.includes(p)));
  renderBadges();
  if(comboOpen) renderOptions();
  elCards.innerHTML = '';
  elInfo.textContent = '';
  elInfo.classList.remove('warn');
  elState.textContent = '';
  btnStart.disabled = true;
  btnResh.disabled  = true;
});

renderBadges();
elCards.innerHTML = '<div class="empty-msg">教材とページを選んでください</div>';
</script>
</body>
