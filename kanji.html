<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漢字たまご 練習</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Meiryo","メイリオ","Noto Sans JP",system-ui,sans-serif;color:#1f2937}
body{min-height:100vh;background:#f8faf9;padding:40px 24px}
.wrap{max-width:1100px;margin:0 auto;background:#fff;padding:40px 32px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.08);border:1px solid #e5e7eb}
h1{font-size:1.5rem;font-weight:700;text-align:center;margin-bottom:24px;letter-spacing:2px}
.ctrl{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center;margin-bottom:20px;font-size:15px;color:#4b5563}
.ctrl label{font-weight:600}
.ctrl select,.ctrl input[type=text]{padding:8px 14px;font-size:15px;border-radius:10px;border:1px solid #d1d5db;background:#fff;color:#374151;cursor:pointer;outline:none}
.ctrl select:focus,.ctrl input:focus{border-color:#0f7a40;box-shadow:0 0 0 3px rgba(15,122,64,.15)}
.ctrl input[type=text]{width:140px}
.pages-info{font-size:13px;color:#6b7280;margin-top:4px}
.cards{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:20px;min-height:420px;position:relative}
.flip-card{width:140px;height:180px;perspective:1000px;cursor:pointer}
.flip-card-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.0,.2,1);transform-style:preserve-3d}
.flip-card.flipped .flip-card-inner{transform:rotateY(180deg)}
.flip-card-front,.flip-card-back{position:absolute;width:100%;height:100%;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.08)}
.flip-card-front{background:#fff;border:1px solid #d1d5db}
.flip-card-back{background:#0f7a40;border:1px solid #0f7a40;transform:rotateY(180deg)}
.card-kanji{font-size:clamp(1.4rem,4vw,2.5rem);font-weight:bold;color:#111;line-height:1.2;word-break:break-all}
.card-num{font-size:clamp(1.8rem,5vw,3rem);font-weight:700;color:#fff;line-height:1}
.game-animating .flip-card{pointer-events:none}
.game-animating .flip-card-inner{transition:none!important}

.btn{padding:10px 22px;margin:6px;font-size:14px;border:none;border-radius:12px;cursor:pointer;transition:transform .15s,box-shadow .15s;font-weight:600;color:#fff}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.15)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.b1{background:#0f7a40} .b2{background:#10b981} .b3{background:#f59e0b} .b4{background:#6b7280}
.game-state{text-align:center;font-size:12px;color:#9ca3af;margin-top:4px}
.empty-msg{font-size:18px;color:#dc2626;margin-top:60px}
.back-btn{position:fixed;top:16px;left:20px;z-index:999;padding:8px 16px;background:rgba(255,255,255,.85);backdrop-filter:blur(4px);color:#0f7a40;font-size:14px;font-weight:600;border-radius:10px;border:1px solid #e5e7eb;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.08);transition:transform .15s,box-shadow .15s}
.back-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.12)}

/* ===== JR東日本風 カード美化 ===== */
.flip-card{
    width:140px;height:180px;border-radius:18px;
    transition:transform .3s cubic-bezier(.2,1.3,.3,1), box-shadow .3s;
    position:relative;
}
.flip-card:hover{
    transform:translateY(-6px) scale(1.03);
    box-shadow:0 16px 40px rgba(15,122,64,.20);
}
.flip-card-front, .flip-card-back{
    border-radius:18px!important;
    box-shadow:0 8px 24px rgba(15,122,64,.12)!important;
    overflow:hidden;position:absolute;
}
.flip-card-front{
    background:linear-gradient(160deg,#ffffff 0%,#f0fdf4 100%)!important;
    border:1px solid #d1fae5!important;
}
.flip-card-front::before{
    content:'';position:absolute;z-index:-1;top:-30px;right:-30px;width:70px;height:70px;
    border-radius:50%;background:#0f7a40;opacity:.07;
}
.flip-card-front::after{
    content:'';position:absolute;z-index:-1;bottom:10px;left:10px;
    width:20px;height:20px;border-radius:3px;
    border:2px solid #0f7a40;opacity:.15;transform:rotate(12deg);
}
.flip-card-back{
    background:linear-gradient(160deg,#0f7a40 0%,#0a5c2f 100%)!important;
    border:1px solid #0a5c2f!important;
    box-shadow:0 12px 32px rgba(15,122,64,.30)!important;
}
.flip-card-back::before{
    content:'';position:absolute;z-index:-1;top:0;left:0;width:100%;height:40%;
    background:linear-gradient(180deg,rgba(255,255,255,.14) 0%,transparent 100%);
    pointer-events:none;
}
.card-kanji{
    font-size:clamp(1.4rem,4vw,2.5rem)!important;
    font-weight:700!important;
    color:#0f7a40!important;
    position:relative;
}
.card-num{
    font-size:clamp(1.8rem,5vw,3rem)!important;
    font-weight:800!important;
    color:#ffffff!important;
    letter-spacing:.05em;
    position:relative;
}



/* ===== 翻転後の子要素透け問題 修正 ===== */
/* text-shadow 等で独立合成層が生成されると backface-visibility:hidden が効かない */
/* 子要素にも backface-visibility:hidden を付ける */
.flip-card-front > *,
.flip-card-back > *{
    -webkit-backface-visibility:hidden;
    backface-visibility:hidden;
}
/* text-shadow も消す（合成層生成のトリガー） */
.kana-front, .kana-back, .roma-back,
.card-kanji, .card-num{
    text-shadow:none !important;
}



/* 背景：首页草坡图（低透明度 + 高斯模糊） */
.page-bg{position:fixed;inset:0;z-index:0;background:#f8faf9 url('assets/hero-34-bg.jpg') center/cover no-repeat;opacity:.16;filter:blur(12px);transform:scale(1.06);pointer-events:none;}
body>*:not(.page-bg):not(.back-btn):not(.popup-wrap){position:relative;z-index:1;}
</style>
</head>
<body>
<div class="page-bg" aria-hidden="true"></div>
<a class="back-btn" href="./index.html">← ホーム</a>
<div class="wrap">
<h1>漢字たまご 練習</h1>
<div class="ctrl">
  <label>教材</label>
  <select id="sel-level">
    <option value="初級">漢字たまご 初級</option>
    <option value="初中級">漢字たまご 初中級</option>
  </select>
  <label>ページ</label>
  <input type="text" id="inp-pages" placeholder="例：10 11 12" autocomplete="off">
  <button class="btn b1" onclick="generate()">表示</button>
  <button class="btn b2" id="btn-start" onclick="startGame()" disabled>開始ゲーム</button>
  <button class="btn b4" onclick="resetAll()">再生成</button>
  <div class="pages-info" id="pages-info"></div>
</div>
<div class="game-state" id="game-state"></div>
<div class="cards" id="cards"></div>
</div>

,"重い","体重","太","太い","太る","計","体重計","計画","時計","不","不足","不便","不可","不明","痛","頭痛","痛い"],"131":["健康","両","肩","体脂肪","秒"],"141":["文","作文","文学部","注文","文化","文字","研","研究","究","課","学生課","課題","課長","題","問題","宿題"],"142":["習","習う","予習","実習","練習","堂","食堂","講堂","席","出席","欠席","全","全部","安全"],"143":["授業","宿題","実習","寮","期限"],"151":["都","都合","東京都","県","北","東北地方","北海道","西","関西","西洋","東西南北","正","正しい","正月"],"152":["花","花見","花瓶","花粉症","祭","祭り","文化祭","青","青い","青春","真っ青","黒","黒い","白","白い","白紙"],"153":["赤","赤い","赤飯","真っ赤","関西","お祝い","結婚式"],"163":["漢","漢字","字","ローマ字","文字","暑","暑い","残暑","寒","寒い","去","去年","過去"],"164":["質","質問","答","答える","答え","同","同時","同じ","思","思う","思い出す","考","考える"],"165":["銀","銀行","悪","最悪","悪い","調べる","増える","減る","過去","殺す","盗む","逮捕"]}};

let gameActive = false;
let gameAnimating = false;
let currentLevel = null;
const BOX_PAD = 14; // 每张卡堆叠时的偏移（模拟牌堆厚度）

function parsePages(str){
    if(!str) return [];
    return [...new Set(str.split(/[\s,、，]+/).map(s=>s.trim()).filter(Boolean))];
}

function renderCards(chars){
    const box = document.getElementById('cards');
    box.innerHTML = '';
    gameActive = false;
    gameAnimating = false;
    box.classList.remove('game-animating');
    document.getElementById('game-state').textContent = '';
    document.getElementById('btn-start').disabled = false;
    chars.forEach(function(c, i){
        const card = document.createElement('div');
        card.className = 'flip-card';
        card.innerHTML = '<div class="flip-card-inner">'
            + '<div class="flip-card-front"><div class="card-kanji">' + c + '</div></div>'
            + '<div class="flip-card-back"><div class="card-num">#' + (i+1) + '</div></div>'
            + '</div>';
        card.addEventListener('click', function(){
            if(gameAnimating || !gameActive) return;
            card.classList.toggle('flipped');
        });
        box.appendChild(card);
    });
}

function generate(){
    const level = document.getElementById('sel-level').value;
    currentLevel = level;
    const pages = parsePages(document.getElementById('inp-pages').value);
    const data = KANJI_TAMAGO[level] || {};
    const availablePages = Object.keys(data);
    const found = [];
    const missing = [];
    pages.forEach(function(p){
        if(data[p]) found.push.apply(found, data[p]);
        else missing.push(p);
    });
    var info = '';
    if(found.length){
        info = '表示 ' + found.length + ' 字';
        if(missing.length) info += '（' + missing.join(',') + ' ページなし）';
    }
    document.getElementById('pages-info').textContent = info;
    if(!found.length){
        var msg = missing.length ? 'ページ ' + missing.join(',') + ' は未収録です' : 'ページを入力してください';
        var hint = level + ' の収録ページ: ' + availablePages.sort(function(a,b){return +a-+b}).join('・');
        document.getElementById('cards').innerHTML = '<div class="empty-msg">' + msg + '</div><div style="color:#6b7280;font-size:14px;margin-top:8px">' + hint + '</div>';
        document.getElementById('btn-start').disabled = true;
        return;
    }
    renderCards(found);
}

function startGame(){
    const box = document.getElementById('cards');
    const cards = Array.from(document.querySelectorAll('.flip-card'));
    if(!cards.length || gameAnimating) return;

    gameAnimating = true;
    gameActive = false;
    box.classList.add('game-animating');
    document.getElementById('btn-start').disabled = true;
    document.getElementById('game-state').textContent = '🎴 カードをシャッフル中...';

    // === 阶段 1：翻背面 (400ms) ===
    cards.forEach(function(c){ c.classList.add('flipped'); });
    const t1_end = 420;

    // === 阶段 2：收拢到中心堆叠 (450ms) ===
    setTimeout(function(){
        const boxRect = box.getBoundingClientRect();
        const centerX = boxRect.left + boxRect.width / 2;
        const centerY = boxRect.top + boxRect.height / 2;

        // 读每张卡当前位置，计算到中心的偏移
        cards.forEach(function(c, i){
            const r = c.getBoundingClientRect();
            // 堆叠时每张卡略微偏移，模拟牌堆厚度
            const stackX = centerX - r.left - BOX_PAD * i;
            const stackY = centerY - r.top - BOX_PAD * i;
            const stackR = (Math.random() * 6 - 3).toFixed(2); // -3~3度旋转
            c.style.transition = 'transform 450ms cubic-bezier(.55,.05,.3,.95)';
            c.style.transform = 'translate(' + stackX + 'px,' + stackY + 'px) rotate(' + stackR + 'deg)';
            c.style.zIndex = i;
        });
    }, t1_end);
    const t2_end = t1_end + 470;

    // === 阶段 3：洗牌抖动 (4轮 × 100ms) ===
    setTimeout(function(){
        let round = 0;
        function jitter(){
            if(round >= 4){
                // 洗牌结束，把所有 zIndex 打乱（视觉上更像真洗过）
                cards.forEach(function(c){ c.style.zIndex = Math.floor(Math.random() * cards.length); });
                return;
            }
            round++;
            cards.forEach(function(c){
                const dx = (Math.random() * 32 - 16).toFixed(1);
                const dy = (Math.random() * 24 - 12).toFixed(1);
                const r = (Math.random() * 24 - 12).toFixed(2);
                c.style.transition = 'transform 100ms cubic-bezier(.25,.8,.25,1)';
                c.style.transform = 'translate(' + dx + 'px,' + dy + 'px) rotate(' + r + 'deg)';
            });
            setTimeout(jitter, 110);
        }
        jitter();
    }, t2_end);
    const t3_end = t2_end + 480; // 4轮 × 110ms

    // === 阶段 4：DOM 重排 + 重编号 + 计算发牌起点（在中心堆叠位置冻结）===
    setTimeout(function(){
        // 关闭过渡，重排 DOM，强制浏览器重排读新位置
        cards.forEach(function(c){ c.style.transition = 'none'; });
        box.style.transition = 'none';

        // 洗牌 DOM 顺序
        const shuffled = cards.slice();
        for(let i = shuffled.length - 1; i > 0; i--){
            const j = Math.floor(Math.random() * (i+1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        shuffled.forEach(function(c){ box.appendChild(c); });

        // 强制重排，读新的 flex 布局位置（这就是"发牌落点"）
        void box.offsetHeight;
        const newCards = Array.from(document.querySelectorAll('.flip-card'));
        const targetRects = newCards.map(function(c){ return c.getBoundingClientRect(); });

        // 当前每张卡还停在中心堆叠位置（带偏移），记录它们此刻的位置
        const currentRects = newCards.map(function(c){ return c.getBoundingClientRect(); });

        // 从中心堆叠 → 新目标位置的位移
        const boxLeft = box.getBoundingClientRect().left;
        const boxTop = box.getBoundingClientRect().top;
        newCards.forEach(function(c, i){
            const dx = currentRects[i].left - targetRects[i].left;
            const dy = currentRects[i].top - targetRects[i].top;
            // 保持在中心堆叠位置（translate 回原位）
            c.style.transform = 'translate(' + dx + 'px,' + dy + 'px) rotate(0deg)';
            c.style.zIndex = '';
            // 重新编号
            c.querySelector('.card-num').textContent = '#' + (i+1);
        });

        // 下一帧开启动画，逐张释放 transform
        requestAnimationFrame(function(){
            requestAnimationFrame(function(){
                // 阶段 5：发牌动画（逐张错落）
                newCards.forEach(function(c, i){
                    setTimeout(function(){
                        c.style.transition = 'transform 400ms cubic-bezier(.2,.8,.2,1)';
                        c.style.transform = '';
                    }, i * 55);
                });

                // 等最后一张发完
                setTimeout(function(){
                    // 清理内联样式
                    newCards.forEach(function(c){ c.style.transition = ''; c.style.transform = ''; });
                    box.classList.remove('game-animating');
                    gameAnimating = false;
                    gameActive = true;
                    document.getElementById('btn-start').disabled = false;
                    document.getElementById('game-state').textContent = '🎮 ゲーム開始！ カードをタップして漢字を確認';
                }, newCards.length * 55 + 450);
            });
        });
    }, t3_end);
}

function resetAll(){
    const box = document.getElementById('cards');
    box.classList.remove('game-animating');
    document.getElementById('inp-pages').value = '';
    document.getElementById('cards').innerHTML = '';
    document.getElementById('pages-info').textContent = '';
    document.getElementById('game-state').textContent = '';
    document.getElementById('btn-start').disabled = true;
    gameActive = false;
    gameAnimating = false;
}

document.getElementById('inp-pages').addEventListener('keydown', function(e){
    if(e.key==='Enter') generate();
});
document.getElementById('sel-level').addEventListener('change', function(){
    document.getElementById('inp-pages').value='';
    document.getElementById('cards').innerHTML='';
    document.getElementById('pages-info').textContent='';
    document.getElementById('game-state').textContent='';
    document.getElementById('btn-start').disabled=true;
    gameActive = false;
});
</script>
