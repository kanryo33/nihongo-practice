<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本語 基礎練習 | 五十音・数字・日付・時刻</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Meiryo","メイリオ","Noto Sans JP",system-ui,sans-serif;}
body{
    min-height:100vh;
    background:linear-gradient(135deg,#eef2ff 0%,#fdf4ff 50%,#f0fdf4 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px;
    color:#1f2937;
}
header{text-align:center;margin-bottom:48px;}
h1{font-size:clamp(1.8rem,5vw,2.6rem);font-weight:700;letter-spacing:2px;margin-bottom:12px;}
.subtitle{font-size:1rem;color:#6b7280;}
.cards{
    display:flex;
    gap:24px;
    flex-wrap:wrap;
    justify-content:center;
    max-width:900px;
}
.card{
    display:block;
    width:320px;
    padding:36px 28px;
    background:#fff;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
    text-decoration:none;
    color:inherit;
    transition:transform .2s,box-shadow .2s;
    border:1px solid #e5e7eb;
}
.card:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,.12);}
.icon{font-size:3rem;margin-bottom:16px;}
.card h2{font-size:1.4rem;margin-bottom:8px;}
.card p{font-size:.95rem;color:#6b7280;line-height:1.5;}
.badge{display:inline-block;margin-top:14px;padding:4px 12px;border-radius:999px;font-size:.8rem;font-weight:600;}
.badge-kana{background:#eef2ff;color:#4f46e5;}
.badge-suuji{background:#fff7ed;color:#ea580c;}
footer{margin-top:48px;font-size:.85rem;color:#9ca3af;}
</style>
</head>
<body>
<header>
    <h1>日本語 基礎練習</h1>
    <p class="subtitle">五十音 ・ 数字 ・ 日付 ・ 時刻 　のランダム練習ツール</p>
</header>

<div class="cards">
    <a class="card" href="kana.html">
        <div class="icon">あ</div>
        <h2>五十音 ランダム練習</h2>
        <p>ひらがな・カタカナをランダム出題。カードをクリックしてローマ字を確認。基本五十音・濁音・拗音を選択可能。</p>
        <span class="badge badge-kana">ひらがな / カタカナ</span>
    </a>

    <a class="card" href="suuji.html">
        <div class="icon">123</div>
        <h2>数字・日付・時刻 練習</h2>
        <p>数字（1〜8桁）・年月日・時刻をランダム出題。「読み方表示」で正しい読みを確認。</p>
        <span class="badge badge-suuji">数字 / 日付 / 時刻</span>
    </a>
</div>

<footer>
    2 つのツールを 1 つのプロジェクトに統合
</footer>
</body>
</html>
