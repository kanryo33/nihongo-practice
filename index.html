<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本語 基礎練習 | 五十音・数字・日付・時刻</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Meiryo","メイリオ","Noto Sans JP",system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
html,body{background:#ffffff;}
body{
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    color:#1f2937;line-height:1.6;overflow-x:hidden;
}

/* ========= Hero ========= */
.hero{
    position:relative;width:100%;
    text-align:center;
    padding:96px 24px 72px;
    overflow:hidden;
}
.hero h1{
    position:relative;z-index:3;
    font-size:clamp(2.6rem,7vw,4.5rem);
    font-weight:700;letter-spacing:.02em;line-height:1.25;
    color:#111827;margin-bottom:22px;
}
.hero h1 .accent{color:#0f7a40;}
.hero .sub{
    position:relative;z-index:3;
    font-size:clamp(.95rem,1.8vw,1.15rem);
    color:#6b7280;letter-spacing:.05em;
}

/* Hero 背景の大きな曲線 SVG */
.hero-bg-curve{
    position:absolute;bottom:-40px;left:0;width:100%;height:320px;z-index:1;pointer-events:none;opacity:.35;
}
/* Hero 右の大きな円 */
.hero-bg-circle{
    position:absolute;top:-120px;right:-140px;width:420px;height:420px;z-index:1;
    pointer-events:none;
}
/* Hero 左の小さな雲 */
.hero-bg-cloud{
    position:absolute;top:40px;left:-80px;width:220px;height:160px;z-index:1;
    pointer-events:none;opacity:.55;
}

/* Hero 周りに浮かぶ小さな装飾 */
.deco{position:absolute;pointer-events:none;z-index:2;}
.deco-dot-1{top:20%;left:12%;}
.deco-dot-2{top:15%;right:25%;}
.deco-dot-3{top:55%;left:18%;}
.deco-tri{top:65%;right:18%;}
.deco-ring{top:30%;right:8%;}

/* Hero 下の緑セクション */
.green-band{
    width:100%;background:#0f7a40;
    padding:48px 24px;color:#fff;
    text-align:center;position:relative;
}
.green-band::before,.green-band::after{
    content:'';position:absolute;left:0;width:100%;height:24px;
    background:inherit;
}
.green-band::before{top:-12px;border-radius:0 0 50% 50% / 100% 100% 0 0;}
.green-band::after{bottom:-12px;border-radius:50% 50% 0 0 / 0 0 100% 100%;}
.green-band p{font-size:clamp(.95rem,1.8vw,1.1rem);opacity:.95;letter-spacing:.06em;}
.green-band .tiny-decos{
    position:absolute;top:100%;left:0;width:100%;height:40px;pointer-events:none;
}

/* ========= Project Folders（卡片ファン スタイル） ========= */
.cards{
    display:flex;gap:28px;flex-wrap:wrap;justify-content:center;
    max-width:1000px;padding:56px 24px 40px;width:100%;
    position:relative;
}

/* 单个文件夹 */
.project-folder{
    position:relative;width:288px;height:224px;flex:0 0 auto;display:block;
    text-decoration:none;color:inherit;
    border-radius:18px;perspective:1200px;cursor:pointer;outline:none;
    transition:transform .25s ease;
}
.project-folder:focus-visible{box-shadow:0 0 0 4px rgba(15,122,64,.28);border-radius:18px;}

/* 背面の壁（開くと後ろに傾く） */
.pf-back{
    position:absolute;inset:0;border-radius:18px;
    border:1px solid rgba(0,0,0,.08);
    background:rgba(255,255,255,.28);backdrop-filter:blur(12px);
    transform-origin:center bottom;transform:rotateX(0deg);
    transition:transform .5s cubic-bezier(.2,.8,.2,1);
}
.project-folder.is-open .pf-back{transform:rotateX(15deg);}

/* ファンの枠（中央上に固定されたアンカー点） */
.pf-files{position:absolute;left:50%;top:12px;width:0;height:0;z-index:5;pointer-events:none;}

/* ファイルカード */
.pf-file{
    position:absolute;left:0;top:0;width:96px;height:150px;margin-left:-48px;
    border-radius:10px;border:1px solid rgba(0,0,0,.08);
    background:var(--c,#bbf7d0);overflow:hidden;
    box-shadow:0 6px 16px rgba(0,0,0,.10);
    transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .5s ease;
    will-change:transform;
}
.pf-file .pf-lines{position:absolute;left:12px;top:14px;width:56px;}
.pf-file .pf-lines i{display:block;height:3px;border-radius:2px;background:rgba(0,0,0,.12);margin-bottom:7px;}
.pf-file .pf-mark{position:absolute;right:10px;bottom:8px;font-size:1.7rem;font-weight:700;color:rgba(0,0,0,.42);}

/* 前面のラベル（開くと手前に傾く） */
.pf-front{
    position:absolute;inset-inline:0;bottom:0;height:112px;overflow:hidden;
    border-radius:18px;border:1px solid rgba(0,0,0,.08);
    background:rgba(255,255,255,.7);backdrop-filter:blur(18px);
    transform-origin:center bottom;transform:rotateX(0deg);
    transition:transform .5s cubic-bezier(.2,.8,.2,1);
    backface-visibility:hidden;z-index:20;
}
.project-folder.is-open .pf-front{transform:rotateX(-25deg);}
.pf-title-row{height:64px;display:flex;align-items:center;padding:0 18px;}
.pf-title{font-size:1.15rem;font-weight:700;color:#111827;line-height:1.3;}
.pf-meta-row{height:48px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 18px;border-top:1px solid rgba(0,0,0,.08);}
.pf-count{font-size:.8rem;font-weight:600;color:rgba(0,0,0,.6);white-space:nowrap;}
.pf-desc{font-size:.8rem;color:#6b7280;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* Footer */
footer{
    padding:32px 24px 48px;font-size:.82rem;color:#9ca3af;text-align:center;
}

@media(max-width:640px){
    .hero{padding:64px 20px 44px;}
    .hero-bg-circle{width:260px;height:260px;top:-80px;right:-80px;}
    .hero-bg-cloud{width:160px;height:110px;top:20px;left:-40px;}
    .cards{gap:24px;padding:40px 16px 28px;}
    .project-folder{width:288px;max-width:100%;}
    .green-band{padding:36px 20px;}
}
</style>
</head>
<body>

<!-- ===== Hero セクション ===== -->
<section class="hero">

    <!-- 右の大きな薄い円 -->
    <svg class="hero-bg-circle" viewBox="0 0 420 420" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="210" cy="210" r="200" fill="#0f7a40" fill-opacity="0.06"/>
        <circle cx="210" cy="210" r="140" fill="#0f7a40" fill-opacity="0.04"/>
    </svg>

    <!-- 左の雲っぽい曲線 -->
    <svg class="hero-bg-cloud" viewBox="0 0 220 160" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M30 120 Q10 80 50 70 Q55 40 95 45 Q130 25 155 55 Q195 60 190 100 Q210 130 170 135 Q130 150 90 140 Q50 150 30 120Z"
              fill="#0f7a40" fill-opacity="0.08"/>
    </svg>

    <!-- Hero 下の波うつ曲線 -->
    <svg class="hero-bg-curve" viewBox="0 0 1440 320" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
        <path d="M0 224 Q 180 140 360 192 T 720 176 T 1080 208 T 1440 160 L1440 320 L0 320Z" fill="#0f7a40" fill-opacity="0.07"/>
        <path d="M0 260 Q 220 200 440 240 T 880 224 T 1320 250 L1440 240 L1440 320 L0 320Z" fill="#0f7a40" fill-opacity="0.05"/>
    </svg>

    <!-- 装飾小物 -->
    <svg class="deco deco-dot-1" width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="#0f7a40" fill-opacity="0.35"/></svg>
    <svg class="deco deco-dot-2" width="10" height="10" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="#0f7a40" fill-opacity="0.25"/></svg>
    <svg class="deco deco-dot-3" width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="9" fill="none" stroke="#0f7a40" stroke-width="1.5" stroke-opacity="0.3"/></svg>
    <svg class="deco deco-tri" width="28" height="28" viewBox="0 0 28 28"><polygon points="14,3 26,25 2,25" fill="#0f7a40" fill-opacity="0.18"/></svg>
    <svg class="deco deco-ring" width="48" height="48" viewBox="0 0 48 48">
        <circle cx="24" cy="24" r="20" fill="none" stroke="#0f7a40" stroke-width="2" stroke-opacity="0.15"/>
        <circle cx="24" cy="24" r="12" fill="none" stroke="#0f7a40" stroke-width="1" stroke-opacity="0.2"/>
    </svg>

    <h1>日本語 <span class="accent">基礎練習</span></h1>
    <p class="sub">五十音 ・ 数字 ・ 日付 ・ 時刻 　のランダム練習ツール</p>
</section>

<!-- ===== 緑の帯 ===== -->
<div class="green-band">
    <p>学びたい場所を、選んでください。</p>
</div>

<!-- ===== カード（Project Folder スタイル） ===== -->
<div class="cards">

    <!-- Folder 1: 五十音 -->
    <a class="project-folder" href="kana.html" aria-label="五十音 ランダム練習を開く">
        <div class="pf-back" aria-hidden="true"></div>
        <div class="pf-files" aria-hidden="true">
            <div class="pf-file" style="--c:#bbf7d0"><span class="pf-lines"><i></i><i></i><i></i></span><span class="pf-mark">あ</span></div>
            <div class="pf-file" style="--c:#fed7aa"><span class="pf-lines"><i></i><i></i><i></i></span><span class="pf-mark">か</span></div>
            <div class="pf-file" style="--c:#bae6fd"><span class="pf-lines"><i></i><i></i><i></i></span><span class="pf-mark">さ</span></div>
            <div class="pf-file" style="--c:#ddd6fe"><span class="pf-lines"><i></i><i></i><i></i></span><span class="pf-mark">た</span></div>
            <div class="pf-file" style="--c:#fef3c7"><span class="pf-lines"><i></i><i></i><i></i></span><span class="pf-mark">な</span></div>
        </div>
        <div class="pf-front" aria-hidden="true">
            <div class="pf-title-row"><div class="pf-title">五十音 ランダム練習</div></div>

    <!-- Folder 2: 数字・日付・時刻 -->
    <a class="project-folder" href="suuji.html" aria-label="数字・日付・時刻 練習を開く">
        <div class="pf-back" aria-hidden="true"></div>
        <div class="pf-files" aria-hidden="true">
            <div class="pf-file" style="--c:#bbf7d0"><span class="pf-lines"><i></i><i></i><i></i></span><span class="pf-mark">1</span></div>
            <div class="pf-file" style="--c:#fed7aa"><span class="pf-lines"><i></i><i></i><i></i></span><span class="pf-mark">2</span></div>
            <div class="pf-file" style="--c:#bae6fd"><span class="pf-lines"><i></i><i></i><i></i></span><span class="pf-mark">3</span></div>
            <div class="pf-file" style="--c:#ddd6fe"><span class="pf-lines"><i></i><i></i><i></i></span><span class="pf-mark">4</span></div>
            <div class="pf-file" style="--c:#fef3c7"><span class="pf-lines"><i></i><i></i><i></i></span><span class="pf-mark">5</span></div>
        </div>
        <div class="pf-front" aria-hidden="true">
            <div class="pf-title-row"><div class="pf-title">数字・日付・時刻 練習</div></div>
            <div class="pf-meta-row"><span class="pf-count">5 files</span><span class="pf-desc">数字 / 日付 / 時刻</span></div>

    <!-- Folder 3: 漢字 -->
    <a class="project-folder" href="kanji.html" aria-label="漢字 反転カードを開く">
        <div class="pf-back" aria-hidden="true"></div>
        <div class="pf-files" aria-hidden="true">
            <div class="pf-file" style="--c:#bbf7d0"><span class="pf-lines"><i></i><i></i><i></i></span><span class="pf-mark">日</span></div>
            <div class="pf-file" style="--c:#fed7aa"><span class="pf-lines"><i></i><i></i><i></i></span><span class="pf-mark">月</span></div>
            <div class="pf-file" style="--c:#bae6fd"><span class="pf-lines"><i></i><i></i><i></i></span><span class="pf-mark">火</span></div>
            <div class="pf-file" style="--c:#ddd6fe"><span class="pf-lines"><i></i><i></i><i></i></span><span class="pf-mark">水</span></div>
            <div class="pf-file" style="--c:#fef3c7"><span class="pf-lines"><i></i><i></i><i></i></span><span class="pf-mark">木</span></div>
        </div>
        <div class="pf-front" aria-hidden="true">
            <div class="pf-title-row"><div class="pf-title">漢字 反転カード</div></div>
            <div class="pf-meta-row"><span class="pf-count">5 files</span><span class="pf-desc">漢字 初級 / 初中級</span></div>
        </div>
    </a>

</div>

<footer>
    Japanese Practice Tools · 日本語教師向けランダム出題
</footer>

<script>
(function(){
  // オリジナル getPreviewTransform を再現（中央が最大、外側へ行くほど小さく透明）
  function getPreviewTransform(index, count){
    const offset = index - (count - 1) / 2;
    const distance = Math.abs(offset);
    const centerLift = Math.max(0, 2 - distance) * 8;
    return {
      x: offset * 44,
      y: 8 - centerLift,
      rotate: offset * 6,
      scale: distance === 0 ? 1.04 : distance === 1 ? 0.95 : 0.88,
      opacity: distance === 0 ? 1 : distance === 1 ? 0.78 : 0.58,
      zIndex: 10 - distance
    };
  }
  // 開状態（hover/open）は 1.4倍広げて8px上がり、透明度も少し上げる
  function openBoost(t){
    return {
      x: t.x * 1.4,
      y: t.y - 8,
      rotate: t.rotate * 1.3,
      scale: t.scale * 1.02,
      opacity: Math.min(1, t.opacity + 0.18),
      zIndex: t.zIndex
    };
  }
  function apply(card, t){
    card.style.transform =
      'translate(' + t.x + 'px,' + t.y + 'px) rotate(' + t.rotate + 'deg) scale(' + t.scale + ')';
    card.style.opacity = t.opacity;
    card.style.zIndex = t.zIndex;
  }

  const folders = Array.prototype.slice.call(document.querySelectorAll('.project-folder'));
  folders.forEach(function(folder){
    const cards = Array.prototype.slice.call(folder.querySelectorAll('.pf-file'));
    folder._cards = cards.map(function(card){
      const t = getPreviewTransform(cards.indexOf(card), cards.length);
      const o = openBoost(t);
      card._base = t; card._open = o;
      apply(card, t);
      return card;
    });
    folder._files = cards.map(function(card){
      return {
        color: getComputedStyle(card).getPropertyValue('--c').trim(),
        glyph: card.querySelector('.pf-mark').textContent
      };
    });

    function setOpen(open){
      folder.classList.toggle('is-open', open);
      folder._cards.forEach(function(c){ apply(c, open ? c._open : c._base); });
    }
    folder.addEventListener('mouseenter', function(){ setOpen(true); });
    folder.addEventListener('mouseleave', function(){ if(!folder._expanded) setOpen(false); });
    folder.addEventListener('focus', function(){ setOpen(true); });
    folder.addEventListener('blur', function(){ if(!folder._expanded) setOpen(false); });
  });

})();
</script>

</body>
